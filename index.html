<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production OS · MAFI LR-340</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --cream:#F7F2E9;
  --linen:#EFE6D6;
  --paper:#FBF8F2;
  --ink:#2C261E;
  --ink-soft:#6B6154;
  --line:#E3D8C3;
  --terracotta:#B85C38;
  --terracotta-deep:#9A4A2C;
  --gold:#C79A4B;
  --green:#5C7A54;
  --green-bg:#E7EEDF;
  --amber:#B8863B;
  --amber-bg:#F3E7CD;
  --red:#AA4A3F;
  --red-bg:#F3E0DB;
  --blue:#4A6E82;
  --blue-bg:#DFEAEE;
  --purple:#7C6187;
  --purple-bg:#EBE2ED;
  --gray:#8A8175;
  --gray-bg:#EAE4D8;
  --serif:'Cormorant Garamond', serif;
  --sans:'DM Sans', sans-serif;
  --radius:10px;
  --shadow:0 2px 12px rgba(44,38,30,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold); color:#fff;}
button{font-family:var(--sans); cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

/* ---------- Auth Screen ---------- */
#authScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 20% 20%, #FBF6EC, var(--cream) 60%);
  padding:24px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--paper); border:1px solid var(--line);
  border-radius:16px; padding:40px 36px; box-shadow:var(--shadow);
}
.auth-card h1{
  font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px;
  color:var(--terracotta-deep); letter-spacing:0.3px;
}
.auth-card p.sub{color:var(--ink-soft); margin:0 0 28px; font-size:14px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:14px; color:var(--ink); outline:none; transition:border-color .15s;
}
.field input:focus{border-color:var(--terracotta);}
.btn{
  border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:600;
  transition:transform .1s, opacity .15s; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--terracotta); color:#fff; width:100%;}
.btn-primary:hover{background:var(--terracotta-deep);}
.btn-ghost{background:transparent; color:var(--terracotta-deep); border:1px solid var(--line);}
.btn-ghost:hover{background:var(--linen);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:7px;}
.auth-toggle{margin-top:18px; text-align:center; font-size:13px; color:var(--ink-soft);}
.auth-toggle a{color:var(--terracotta); cursor:pointer; font-weight:600; text-decoration:none;}
.auth-error{background:var(--red-bg); color:var(--red); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px;}
.auth-logo{width:44px; height:44px; border-radius:12px; background:var(--terracotta); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:22px; font-weight:600; margin-bottom:16px;}

/* ---------- App Shell ---------- */
#app{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--linen); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-header{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.sidebar-header .brand{font-family:var(--serif); font-weight:600; font-size:21px; color:var(--terracotta-deep); line-height:1.15;}
.sidebar-header .brand-sub{font-size:11px; color:var(--ink-soft); letter-spacing:0.08em; text-transform:uppercase; margin-top:3px;}
.nav-group{padding:14px 12px 4px;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft); padding:6px 10px; font-weight:700;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13.5px;
  color:var(--ink); cursor:pointer; margin-bottom:2px; transition:background .12s; font-weight:500;
}
.nav-item:hover{background:#fff;}
.nav-item.active{background:var(--terracotta); color:#fff;}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-soft); flex-shrink:0;}
.nav-item.active .dot{background:#fff;}
.nav-item .count{margin-left:auto; font-size:11px; opacity:0.75; font-variant-numeric:tabular-nums;}
.sidebar-footer{margin-top:auto; padding:14px 16px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft);}
.sidebar-footer .user-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sync-pill{font-size:10.5px; padding:3px 8px; border-radius:20px; background:var(--green-bg); color:var(--green); font-weight:600; display:inline-flex; align-items:center; gap:5px;}
.sync-pill.saving{background:var(--amber-bg); color:var(--amber);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:18px 28px; border-bottom:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  flex-wrap:wrap;
}
.topbar h2{font-family:var(--serif); font-size:24px; font-weight:600; margin:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.content{padding:24px 28px 60px; flex:1;}

.search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-box{position:relative; flex:1; min-width:220px; max-width:340px;}
.search-box input{
  width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:13.5px; outline:none;
}
.search-box input:focus{border-color:var(--terracotta);}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.45;}
.chip{
  padding:6px 12px; border-radius:20px; font-size:12.5px; border:1px solid var(--line); background:#fff;
  color:var(--ink-soft); cursor:pointer; font-weight:600; white-space:nowrap;
}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.table-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow);}
table{border-collapse:collapse; width:100%; font-size:12.8px;}
thead th{
  position:sticky; top:0; background:var(--linen); text-align:left; padding:10px 12px; font-weight:700;
  color:var(--ink); border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; z-index:2;
}
thead th:hover{background:#E6DAC2;}
thead th .arrow{opacity:0.5; font-size:10px; margin-left:3px;}
tbody td{padding:6px 10px; border-bottom:1px solid #EFE7D8; vertical-align:middle; white-space:nowrap;}
tbody tr:hover{background:#FCF9F2;}
tbody tr:last-child td{border-bottom:none;}
td .cell-input{
  border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:6px; font-size:12.8px;
  width:100%; min-width:90px; color:var(--ink); font-family:var(--sans);
}
td .cell-input:hover{border-color:var(--line);}
td .cell-input:focus{border-color:var(--terracotta); background:#fff; outline:none;}
td .cell-input[readonly]{color:var(--ink-soft); background:#F7F2E8; cursor:not-allowed;}
select.cell-input{cursor:pointer;}
.rownum{color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:12px; text-align:center; width:34px;}
.row-actions{display:flex; gap:4px;}
.icon-btn{
  border:none; background:transparent; padding:5px; border-radius:6px; color:var(--ink-soft); display:flex;
}
.icon-btn:hover{background:var(--red-bg); color:var(--red);}

.badge{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11.2px; font-weight:700;
  white-space:nowrap; letter-spacing:0.01em;
}
.b-green{background:var(--green-bg); color:var(--green);}
.b-amber{background:var(--amber-bg); color:var(--amber);}
.b-red{background:var(--red-bg); color:var(--red);}
.b-blue{background:var(--blue-bg); color:var(--blue);}
.b-purple{background:var(--purple-bg); color:var(--purple);}
.b-gray{background:var(--gray-bg); color:var(--gray);}

/* Dashboard */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px; box-shadow:var(--shadow);}
.card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:700;}
.card .value{font-family:var(--serif); font-size:34px; font-weight:600; margin-top:6px; color:var(--ink);}
.card .value.accent{color:var(--terracotta);}
.card .sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:20px;}
.panel h3{font-family:var(--serif); font-size:19px; margin:0 0 14px; font-weight:600;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.8px;}
.bar-label{width:150px; flex-shrink:0; color:var(--ink-soft); font-weight:600;}
.bar-track{flex:1; height:10px; background:var(--linen); border-radius:20px; overflow:hidden;}
.bar-fill{height:100%; border-radius:20px;}
.bar-val{width:40px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-weight:600;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(44,38,30,0.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper); border-radius:14px; width:100%; max-width:640px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-family:var(--serif); margin:0; font-size:21px; font-weight:600;}
.modal-body{padding:20px 24px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.modal-body .field.full{grid-column:1/-1;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.close-x{border:none; background:transparent; font-size:20px; color:var(--ink-soft); line-height:1;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state svg{opacity:0.35; margin-bottom:10px;}

.toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:100; opacity:0; transform:translateY(10px); transition:all .25s;}
.toast.show{opacity:1; transform:translateY(0);}

.hint{font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}
.kebab-menu{position:relative;}
.kebab-dropdown{position:absolute; right:0; top:36px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); min-width:180px; display:none; z-index:10; overflow:hidden;}
.kebab-dropdown.open{display:block;}
.kebab-dropdown button{width:100%; text-align:left; padding:10px 14px; background:none; border:none; font-size:13px; color:var(--ink);}
.kebab-dropdown button:hover{background:var(--linen);}

.menu-btn{display:none; border:none; background:transparent; padding:6px; border-radius:8px; color:var(--ink); flex-shrink:0;}
.menu-btn:hover{background:var(--linen);}
.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(44,38,30,0.35); z-index:39;}
.sidebar-backdrop.open{display:block;}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}

@media (max-width:820px){
  .menu-btn{display:flex;}
  .sidebar{position:fixed; left:-260px; top:0; z-index:40; transition:left .2s; box-shadow:0 0 40px rgba(0,0,0,0.2);}
  .sidebar.open{left:0;}
  .content{padding:16px;}
  .topbar{padding:14px 16px;}
  .modal-body{grid-template-columns:1fr;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .card .value{font-size:26px;}
  .topbar h2{font-size:19px;}
}
@media (max-width:480px){
  .grid-cards{grid-template-columns:1fr 1fr;}
  .auth-card{padding:28px 22px;}
}
</style>
</head>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">P</div>
    <h1 id="authTitle">Production OS</h1>
    <p class="sub">MAFI LR-340 · Aria Technologies</p>
    <div id="authError" class="auth-error" style="display:none;"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@ariatechnologies.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="authSubmit">Sign In</button>
    <div class="auth-toggle" id="authToggleWrap">New here? <a id="authToggle">Create an account</a></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">Production OS</div>
        <div class="brand-sub">MAFI LR-340</div>
      </div>
      <nav id="navContainer" style="flex:1; overflow-y:auto;"></nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <span id="userEmailLabel" style="font-weight:600; color:var(--ink); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;"></span>
          <span class="sync-pill" id="syncPill">Synced</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="signOutBtn" style="margin-top:10px; width:100%;">Sign Out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h2 id="pageTitle">Dashboard</h2>
            <div class="desc" id="pageDesc">Live overview across all sheets</div>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<!-- Add/Edit Row Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add Row</h3>
      <button class="close-x" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="modalCancel">Cancel</button>
      <button class="btn btn-primary btn-sm" id="modalSave">Save Row</button>
    </div>
  </div>
</div>

/* =====================================================================
   DATA LOADING / SAVING
   ===================================================================== */
function sheetRef(key){
  return db.collection('workspaces').doc(WORKSPACE_ID).collection('sheets').doc(key);
}

async function loadAllSheets(){
  for(const key of SHEET_ORDER){
    const ref = sheetRef(key);
    const snap = await ref.get();
    if(snap.exists){
      state.sheets[key] = snap.data().rows || [];
    } else {
      const seedRows = (SEED_DATA[key] && SEED_DATA[key].rows) ? JSON.parse(JSON.stringify(SEED_DATA[key].rows)) : [];
      state.sheets[key] = seedRows;
      await ref.set({ rows: seedRows, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  }
  // Re-run ERP-code lookups once on load. This corrects any auto-fill values
  // that were stale or wrong in the original spreadsheet (e.g. Gap Analysis
  // Unit Cost was pulling a date column by mistake) — but only writes back
  // to Firestore if something actually changed, to avoid a write on every login.
  for(const key of SHEET_ORDER){
    const cfg = SHEETS[key];
    if(!cfg.lookups) continue;
    const rows = state.sheets[key] || [];
    const before = JSON.stringify(rows);
    rows.forEach(row => applyLookup(key, row));
    if(JSON.stringify(rows) !== before){
      await sheetRef(key).set({ rows, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  }
  refreshErpDatalist();
}

function saveSheet(key){
  setSyncState('saving');
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async () => {
    try{
      await sheetRef(key).set({
        rows: state.sheets[key],
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setSyncState('synced');
      if(key === 'bomMaster') refreshErpDatalist();
    }catch(e){
      setSyncState('error');
      showToast('Save failed: ' + e.message);
    }
  }, 700);
}
function setSyncState(s){
  const pill = document.getElementById('syncPill');
  if(s === 'saving'){ pill.textContent = 'Saving…'; pill.className = 'sync-pill saving'; }
  else if(s === 'synced'){ pill.textContent = 'Synced'; pill.className = 'sync-pill'; }
  else { pill.textContent = 'Error'; pill.className = 'sync-pill saving'; }
}

async function resetSheetToSeed(key){
  if(!confirm('Reset "' + SHEETS[key].label + '" to the original data from your last Excel export? This discards edits made in this sheet for everyone using this workspace.')) return;
  const seedRows = (SEED_DATA[key] && SEED_DATA[key].rows) ? JSON.parse(JSON.stringify(SEED_DATA[key].rows)) : [];
  seedRows.forEach(row => { if(SHEETS[key].lookups) applyLookup(key, row); computeRow(key, row); });
  state.sheets[key] = seedRows;
  saveSheet(key);
  render();
  showToast('Sheet reset to original data.');
}

function badgeClass(val){
  if(val === null || val === undefined || val === '') return 'b-gray';
  const v = String(val).toLowerCase();
  if(/(shortage|open|not started|blocked|delay|fail|high|obsolete|cancelled|not ready)/.test(v)) return 'b-red';
  if(/(progress|partial|warehouse|medium|pending|waiting|mo issued|released|pr raised)/.test(v)) return 'b-amber';
  if(/(complete|done|closed|floor|active|low$|received|covered|pass|ready)/.test(v)) return 'b-green';
  if(/(order|sent|inactive)/.test(v)) return 'b-blue';
  if(/(hold|critical|discontinued|not required)/.test(v)) return 'b-purple';
  return 'b-gray';
}

/* =====================================================================
   GENERIC TABLE ENGINE
   ===================================================================== */
function distinctValues(key, colKey){
  const set = new Set();
  (state.sheets[key]||[]).forEach(r => { if(r[colKey] !== undefined && r[colKey] !== null && r[colKey] !== '') set.add(r[colKey]); });
  return Array.from(set).sort();
}

// Egypt work week: Friday & Saturday are weekend (matches original WORKDAY.INTL "0000110").
function addWorkingDays(startDate, days){
  if(!startDate || isNaN(days)) return null;
  let d = new Date(startDate);
  let remaining = Math.round(days);
  const step = remaining >= 0 ? 1 : -1;
  remaining = Math.abs(remaining);
  while(remaining > 0){
    d.setDate(d.getDate() + step);
    const dow = d.getDay(); // 0=Sun ... 5=Fri, 6=Sat
    if(dow !== 5 && dow !== 6) remaining--;
  }
  return d;
}
function fmtDate(d){
  if(!d) return '';
  return d.toISOString().slice(0,10);
}

function computeRow(sheetKey, row){
  if(sheetKey === 'gapAnalysis'){
    const req = Number(row.totalRequiredQuantity)||0;
    const stock = Number(row.onHandStock)||0;
    const floor = Number(row.onHandInternalLocation)||0;
    const mo = Number(row.moIssuedQuantity)||0;
    const po = Number(row.poOrderQuantity)||0;
    const covered = stock + floor + mo + po;
    row.netGap = Math.round((covered - req)*100)/100;
    row.coverage = req===0 ? 1 : Math.round((covered/req)*10000)/10000;
    row.totalCost = Math.round(((Number(row.unitCost)||0) * req)*100)/100;
    // exact status logic from the original Gap Analysis formula:
    // IF(J=0,"NOT REQUIRED", IF(L+M+N>=J,"ON FLOOR", IF(K>=J,"IN WAREHOUSE",
    //   IF(K+L=0, IF(N>0,"ON ORDER","SHORTAGE"), "PARTIAL"))))
    if(!row.erpCode){ row.status = ''; }
    else if(req === 0){ row.status = 'NOT REQUIRED'; }
    else if(floor + mo + po >= req){ row.status = 'ON FLOOR'; }
    else if(stock >= req){ row.status = 'IN WAREHOUSE'; }
    else if(stock + floor === 0){ row.status = po > 0 ? 'ON ORDER' : 'SHORTAGE'; }
    else { row.status = 'PARTIAL'; }
  }
  if(sheetKey === 'productionSchedule'){
    const qty = Number(row.prodOrderNo)||0;
    const leadEa = Number(row.leadTimeEaDays)||0;
    row.totalLeadTimeHours = Math.round(qty * leadEa * 8 * 100)/100;
    if(row.startDatePlan && row.totalLeadTimeHours){
      const end = addWorkingDays(row.startDatePlan, row.totalLeadTimeHours/8);
      row.endDatePlan = fmtDate(end);
    }
    if(row.endDatePlan && row.endDateActual){
      const d = Math.round((new Date(row.endDateActual) - new Date(row.endDatePlan)) / 86400000);
      row.varianceDays = d > 0 ? ('+' + d + ' days') : (d < 0 ? (d + ' days') : 'On Time');
    } else {
      row.varianceDays = '';
    }
  }
  if(sheetKey === 'internalRequests'){
    const req = Number(row.totalRequiredQuantity)||0;
    const floor = Number(row.onHandInternalLocation)||0;
    row.requstedQty = Math.max(0, Math.round((req - floor)*100)/100);
    if(row.requestDate && row.receiptDate){
      row.delayDays = Math.round((new Date(row.receiptDate) - new Date(row.requestDate)) / 86400000);
    } else if(row.requestDate){
      const d = Math.round((new Date() - new Date(row.requestDate)) / 86400000);
      row.delayDays = d>0 ? d : 0;
    } else { row.delayDays = ''; }
  }
  if(sheetKey === 'purchasingTracker'){
    const req = Number(row.totalRequiredQuantity)||0;
    const stock = Number(row.onHandStock)||0;
    row.qtyToOrder = Math.max(0, Math.round((req - stock)*100)/100);
    if(row.promisedDate && row.actualReceiptDate){
      row.delayDays = Math.round((new Date(row.actualReceiptDate) - new Date(row.promisedDate)) / 86400000);
    } else if(row.promisedDate){
      const d = Math.round((new Date() - new Date(row.promisedDate)) / 86400000);
      row.delayDays = d>0 ? d : 0;
    } else { row.delayDays = ''; }
  }
  return row;
}

function applyLookup(sheetKey, row){
  const cfg = SHEETS[sheetKey];
  if(!cfg.lookups) return row;
  cfg.lookups.forEach(lk => {
    const src = state.sheets[lk.from] || [];
    const code = row[lk.key];
    if(!code) return;
    const match = src.find(r => (r.erpCode||'').toLowerCase() === String(code).toLowerCase());
    if(match){
      Object.entries(lk.map).forEach(([destKey, srcKey]) => {
        row[destKey] = match[srcKey] !== undefined ? match[srcKey] : row[destKey];
      });
    }
  });
  return row;
}

function renderTable(sheetKey){
  const cfg = SHEETS[sheetKey];
  const content = document.getElementById('content');
  let rows = (state.sheets[sheetKey] || []).map((r,i) => ({...r, __idx:i}));

  // search filter
  if(state.search){
    const q = state.search.toLowerCase();
    rows = rows.filter(r => cfg.columns.some(c => String(r[c.key]||'').toLowerCase().includes(q)));
  }
  // status filter
  if(state.statusFilter && cfg.statusField){
    rows = rows.filter(r => String(r[cfg.statusField]||'') === state.statusFilter);
  }
  // sort
  if(state.sortKey){
    rows.sort((a,b) => {
      const av = a[state.sortKey], bv = b[state.sortKey];
      if(av === undefined || av === null) return 1;
      if(bv === undefined || bv === null) return -1;
      if(!isNaN(av) && !isNaN(bv)) return (Number(av)-Number(bv)) * state.sortDir;
      return String(av).localeCompare(String(bv)) * state.sortDir;
    });
  }

  const statusChips = cfg.statusField ? distinctValues(sheetKey, cfg.statusField) : [];

  let html = `<div class="search-row">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search ${cfg.label.toLowerCase()}…" value="${state.search}">
    </div>`;
  if(statusChips.length){
    html += `<span class="chip ${!state.statusFilter?'active':''}" data-chip="">All (${(state.sheets[sheetKey]||[]).length})</span>`;
    statusChips.forEach(s => {
      const count = (state.sheets[sheetKey]||[]).filter(r => String(r[cfg.statusField]) === String(s)).length;
      html += `<span class="chip ${state.statusFilter===s?'active':''}" data-chip="${s}">${s} (${count})</span>`;
    });
  }
  html += `</div>`;

  if(!rows.length){
    html += `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <div>No rows match. Try clearing filters, or add a new row.</div>
    </div>`;
    content.innerHTML = html;
    document.getElementById('searchInput').oninput = (e) => { state.search = e.target.value; renderTable(sheetKey); };
    return;
  }

  html += `<div class="table-wrap"><table><thead><tr><th class="rownum">#</th>`;
  cfg.columns.forEach(c => {
    const arrow = state.sortKey === c.key ? (state.sortDir===1?'▲':'▼') : '';
    html += `<th style="min-width:${c.w}px" data-sort="${c.key}">${c.label} <span class="arrow">${arrow}</span></th>`;
  });
  html += `<th style="width:40px"></th></tr></thead><tbody>`;

  rows.forEach((row, displayIdx) => {
    computeRow(sheetKey, row);
    html += `<tr data-idx="${row.__idx}"><td class="rownum">${displayIdx+1}</td>`;
    cfg.columns.forEach(c => {
      html += `<td>${renderCell(sheetKey, row, c)}</td>`;
    });
    html += `<td class="row-actions">
      <button class="icon-btn" data-del="${row.__idx}" title="Delete row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </td></tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<div class="hint">${rows.length} row${rows.length===1?'':'s'} shown · fields in a lighter background auto-fill from Part Master by ERP Code · click a column header to sort</div>`;

  content.innerHTML = html;

  document.getElementById('searchInput').oninput = (e) => { state.search = e.target.value; renderTable(sheetKey); };
  content.querySelectorAll('[data-chip]').forEach(el => {
    el.onclick = () => { state.statusFilter = el.getAttribute('data-chip') || null; renderTable(sheetKey); };
  });
  content.querySelectorAll('th[data-sort]').forEach(el => {
    el.onclick = () => {
      const k = el.getAttribute('data-sort');
      if(state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
      renderTable(sheetKey);
    };
  });
  content.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.getAttribute('data-del'));
      if(confirm('Delete this row?')){
        state.sheets[sheetKey].splice(idx,1);
        saveSheet(sheetKey);
        renderTable(sheetKey);
        buildNav();
      }
    };
  });
  wireCellInputs(sheetKey);
}

function renderCell(sheetKey, row, col){
  const val = row[col.key] === undefined || row[col.key] === null ? '' : row[col.key];
  const idx = row.__idx;
  if(col.type === 'computed'){
    if(col.key === (SHEETS[sheetKey].statusField||'') && val){
      return `<span class="badge ${badgeClass(val)}">${escapeHtml(val)}</span>`;
    }
    return `<input class="cell-input" readonly value="${escapeHtml(val)}">`;
  }
  if(col.type === 'lookup'){
    return `<input class="cell-input" list="erpCodeDatalist" data-key="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}">`;
  }
  if(col.type === 'select'){
    const opts = col.opts === 'suggest' ? distinctValues(sheetKey, col.key) : col.opts;
    let optHtml = `<option value=""></option>`;
    let hasVal = false;
    opts.forEach(o => { if(String(o)===String(val)) hasVal = true; optHtml += `<option ${String(o)===String(val)?'selected':''}>${escapeHtml(o)}</option>`; });
    if(val && !hasVal) optHtml += `<option selected>${escapeHtml(val)}</option>`;
    const badgeCls = (col.key === (SHEETS[sheetKey].statusField||'')) ? badgeClass(val) : '';
    return `<select class="cell-input ${badgeCls?('badge '+badgeCls):''}" data-key="${col.key}" data-idx="${idx}" style="${badgeCls?'':''}">${optHtml}</select>`;
  }
  if(col.type === 'date'){
    return `<input type="date" class="cell-input" data-key="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}">`;
  }
  if(col.type === 'number'){
    return `<input type="number" step="any" class="cell-input" data-key="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}" ${col.auto?'readonly':''}>`;
  }
  return `<input class="cell-input" data-key="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}" ${col.auto?'readonly':''}>`;
}

function refreshErpDatalist(){
  const bom = state.sheets['bomMaster'] || [];
  const dl = document.getElementById('erpCodeDatalist');
  if(!dl) return;
  dl.innerHTML = bom.map(p => `<option value="${escapeHtml(p.erpCode||'')}">${escapeHtml(p.description||'')}</option>`).join('');
}

function wireCellInputs(sheetKey){
  document.querySelectorAll(`[data-idx][data-key]`).forEach(el => {
    const commit = () => {
      const idx = Number(el.getAttribute('data-idx'));
      const key = el.getAttribute('data-key');
      const row = state.sheets[sheetKey][idx];
      if(!row) return;
      row[key] = el.value;
      const col = SHEETS[sheetKey].columns.find(c => c.key === key);
      if(col && col.type === 'lookup'){
        applyLookup(sheetKey, row);
        renderTable(sheetKey);
      }
      saveSheet(sheetKey);
    };
    el.addEventListener('change', commit);
  });
}

/* =====================================================================
   ADD ROW MODAL
   ===================================================================== */
function openRowModal(sheetKey){
  const cfg = SHEETS[sheetKey];
  document.getElementById('modalTitle').textContent = 'Add Row · ' + cfg.label;
  const body = document.getElementById('modalBody');
  let html = '';
  cfg.columns.forEach(c => {
    if(c.type === 'computed') return;
    const full = c.type === 'text' && c.w > 160 ? 'full' : '';
    if(c.type === 'select'){
      const opts = c.opts === 'suggest' ? distinctValues(sheetKey, c.key) : c.opts;
      html += `<div class="field ${full}"><label>${c.label}</label><select id="mf_${c.key}"><option value=""></option>${opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('')}</select></div>`;
    } else if(c.type === 'date'){
      html += `<div class="field ${full}"><label>${c.label}</label><input type="date" id="mf_${c.key}"></div>`;
    } else if(c.type === 'number'){
      html += `<div class="field ${full}"><label>${c.label}</label><input type="number" step="any" id="mf_${c.key}" ${c.auto?'placeholder="auto-fills from ERP Code"':''}></div>`;
    } else if(c.type === 'lookup'){
      html += `<div class="field ${full}"><label>${c.label}</label><input list="erpCodeDatalist" id="mf_${c.key}"></div>`;
    } else {
      html += `<div class="field ${full}"><label>${c.label}</label><input id="mf_${c.key}" ${c.auto?'placeholder="auto-fills from ERP Code"':''}></div>`;
    }
  });
  body.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalSave').onclick = () => {
    const newRow = {};
    cfg.columns.forEach(c => {
      if(c.type === 'computed') return;
      const el = document.getElementById('mf_' + c.key);
      if(el) newRow[c.key] = el.value;
    });
    applyLookup(sheetKey, newRow);
    state.sheets[sheetKey].push(newRow);
    saveSheet(sheetKey);
    closeModal();
    renderTable(sheetKey);
    buildNav();
    showToast('Row added.');
  };
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalOverlay').onclick = (e) => { if(e.target.id === 'modalOverlay') closeModal(); };

/* =====================================================================
   CSV EXPORT
   ===================================================================== */
function exportCSV(sheetKey){
  const cfg = SHEETS[sheetKey];
  const rows = state.sheets[sheetKey] || [];
  const headers = cfg.columns.map(c => c.label);
  const lines = [headers.join(',')];
  rows.forEach(r => {
    computeRow(sheetKey, r);
    const line = cfg.columns.map(c => {
      let v = r[c.key] === undefined || r[c.key] === null ? '' : String(r[c.key]);
      if(v.includes(',') || v.includes('"')) v = '"' + v.replace(/"/g,'""') + '"';
      return v;
    }).join(',');
    lines.push(line);
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sheetKey + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
function renderDashboard(){
  const content = document.getElementById('content');
  const gap = state.sheets.gapAnalysis || [];
  const purch = state.sheets.purchasingTracker || [];
  const prod = state.sheets.productionSchedule || [];
  const asm = state.sheets.assemblyControl || [];
  const action = state.sheets.actionPlan || [];
  const part = state.sheets.partMaster || [];

  gap.forEach(r => computeRow('gapAnalysis', r));
  purch.forEach(r => computeRow('purchasingTracker', r));

  const shortage = gap.filter(r => String(r.status||'').toUpperCase().includes('SHORTAGE')).length;
  const inWarehouse = gap.filter(r => String(r.status||'').toUpperCase().includes('WAREHOUSE')).length;
  const onFloor = gap.filter(r => String(r.status||'').toUpperCase().includes('FLOOR')).length;
  const openPOs = purch.filter(r => !/closed|cancelled|received/i.test(r.status||'')).length;
  const overduePOs = purch.filter(r => r.promisedDate && !r.actualReceiptDate && new Date(r.promisedDate) < new Date()).length;
  const prodCompleted = prod.filter(r => /completed/i.test(r.status||'')).length;
  const prodTotal = prod.length;
  const asmDone = asm.filter(r => /completed/i.test(r.assemblyStatus||'')).length;
  const actionOpen = action.filter(r => !/done|closed|cancelled/i.test(r.currentStatus||'')).length;
  const totalCostAtRisk = gap.filter(r => String(r.status||'').toUpperCase().includes('SHORTAGE')).reduce((s,r)=> s + (Number(r.totalCost)||0), 0);

  let html = `<div class="grid-cards">
    <div class="card"><div class="label">Total Parts</div><div class="value">${part.length}</div><div class="sub">in Part Master</div></div>
    <div class="card"><div class="label">Shortage</div><div class="value accent">${shortage}</div><div class="sub">of ${gap.length} tracked in Gap Analysis</div></div>
    <div class="card"><div class="label">In Warehouse</div><div class="value">${inWarehouse}</div><div class="sub">awaiting internal request</div></div>
    <div class="card"><div class="label">On Floor</div><div class="value">${onFloor}</div><div class="sub">ready to use</div></div>
    <div class="card"><div class="label">Open POs</div><div class="value">${openPOs}</div><div class="sub">${overduePOs} overdue</div></div>
    <div class="card"><div class="label">Production Orders</div><div class="value">${prodCompleted}/${prodTotal}</div><div class="sub">completed</div></div>
    <div class="card"><div class="label">Assembly Complete</div><div class="value">${asmDone}/${asm.length}</div><div class="sub">assembly orders</div></div>
    <div class="card"><div class="label">Open Actions</div><div class="value">${actionOpen}</div><div class="sub">of ${action.length} in Action Plan</div></div>
  </div>`;

  html += `<div class="two-col">`;
  html += `<div class="panel"><h3>Material Gap Status</h3>${barChart(gap, 'status')}</div>`;
  html += `<div class="panel"><h3>Assembly Status</h3>${barChart(asm, 'assemblyStatus')}</div>`;
  html += `</div>`;

  html += `<div class="two-col">`;
  html += `<div class="panel"><h3>Purchasing Status</h3>${barChart(purch, 'status')}</div>`;
  html += `<div class="panel"><h3>Action Plan Status</h3>${barChart(action, 'currentStatus')}</div>`;
  html += `</div>`;

  if(totalCostAtRisk > 0){
    html += `<div class="panel"><h3>Cost at Risk (shortage items)</h3><div style="font-family:var(--serif); font-size:32px; font-weight:600; color:var(--red);">${totalCostAtRisk.toLocaleString(undefined,{maximumFractionDigits:0})} EGP</div><div class="sub" style="margin-top:4px;">Sum of total cost for parts currently in SHORTAGE status</div></div>`;
  }

  html += renderKpiPanel();

  content.innerHTML = html;
}

function barChart(rows, field){
  const counts = {};
  rows.forEach(r => { const v = r[field] || 'Unspecified'; counts[v] = (counts[v]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="hint">No data yet.</div>`;
  const max = Math.max(...entries.map(e=>e[1]));
  const colorFor = (label) => {
    const cls = badgeClass(label);
    return { 'b-green':'var(--green)', 'b-amber':'var(--amber)', 'b-red':'var(--red)', 'b-blue':'var(--blue)', 'b-purple':'var(--purple)', 'b-gray':'var(--gray)' }[cls];
  };
  return entries.map(([label,count]) => `
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100)}%; background:${colorFor(label)}"></div></div>
      <div class="bar-val">${count}</div>
    </div>`).join('');
}

function renderKpiPanel(){
  const kpis = state.sheets.kpis || [];
  if(!kpis.length) return '';
  // auto-refresh known KPIs from live data
  const gap = state.sheets.gapAnalysis || [];
  const purch = state.sheets.purchasingTracker || [];
  kpis.forEach(k => {
    const name = (k.kpi||'').toLowerCase();
    if(name.includes('shortage')) k.thisWeekActual = gap.filter(r => String(r.status||'').toUpperCase().includes('SHORTAGE')).length;
    if(name.includes('overdue') && name.includes('po')) k.thisWeekActual = purch.filter(r => r.promisedDate && !r.actualReceiptDate && new Date(r.promisedDate) < new Date()).length;
  });
  let rows = kpis.map(k => {
    const target = Number(k.target);
    const actual = Number(k.thisWeekActual);
    const good = !isNaN(target) && !isNaN(actual) ? (actual <= target) : null;
    return `<tr>
      <td style="font-weight:600;">${escapeHtml(k.kpi||'')}</td>
      <td style="color:var(--ink-soft); font-size:12px;">${escapeHtml(k.description||'')}</td>
      <td>${escapeHtml(k.target ?? '')}</td>
      <td><span class="badge ${good===null?'b-gray':(good?'b-green':'b-red')}">${escapeHtml(k.thisWeekActual ?? '')} ${escapeHtml(k.unit||'')}</span></td>
      <td style="color:var(--ink-soft); font-size:12px;">${escapeHtml(k.sourceSheet||'')}</td>
    </tr>`;
  }).join('');
  return `<div class="panel"><h3>KPI Dashboard</h3>
    <div class="table-wrap"><table><thead><tr><th>KPI</th><th>Description</th><th>Target</th><th>This Week</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="hint" style="margin-top:10px;">Shortage and overdue-PO KPIs auto-refresh from live data. Edit others directly in the KPIs sheet.</div>
  </div>`;
}

/* =====================================================================
   UTIL
   ===================================================================== */
function escapeHtml(v){
  return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
</script>
