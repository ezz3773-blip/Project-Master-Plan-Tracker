<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">P</div>
    <h1 id="authTitle">Production OS</h1>
    <p class="sub">Multi-project manufacturing tracker · Aria Technologies</p>
    <div id="authError" class="auth-error" style="display:none;"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@ariatechnologies.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="authSubmit">Sign In</button>
    <div class="auth-toggle" id="authToggleWrap">New here? <a id="authToggle">Create an account</a></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">Production OS</div>
        <div class="brand-sub">Multi-project tracker</div>
      </div>
      <div class="project-switcher">
        <button class="project-btn" id="projectSwitcherBtn">
          <span id="currentProjectLabel" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Loading…</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="project-btn" id="listsManagerBtn" style="margin-top:6px;">
          <span>Standard Lists</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
      <nav id="navContainer" style="flex:1; overflow-y:auto;"></nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <span id="userEmailLabel" style="font-weight:600; color:var(--ink); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;"></span>
          <span class="sync-pill" id="syncPill">Synced</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="signOutBtn" style="margin-top:10px; width:100%;">Sign Out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div style="min-width:0;">
            <h2 id="pageTitle">Dashboard</h2>
            <div class="desc" id="pageDesc">Live overview across all sheets</div>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<!-- Project Switcher Modal -->
<div class="modal-overlay" id="projectModalOverlay">
  <div class="modal" style="max-width:420px;">
    <div class="modal-head">
      <h3>Switch Project</h3>
      <button class="close-x" id="projectModalClose">&times;</button>
    </div>
    <div class="project-list" id="projectListContainer"></div>
    <div class="new-project-row">
      <input id="newProjectName" placeholder="New project name…">
      <button class="btn btn-primary btn-sm" id="createProjectBtn" style="width:100%;">+ Create Project</button>
    </div>
  </div>
</div>

<!-- Standard Lists Manager Modal -->
<div class="modal-overlay" id="listsManagerOverlay">
  <div class="modal" style="max-width:560px;">
    <div class="modal-head">
      <h3>Standard Lists</h3>
      <button class="close-x" id="listsManagerClose">&times;</button>
    </div>
    <div class="modal-body" style="display:block; max-height:65vh; overflow-y:auto;" id="listsManagerBody"></div>
  </div>
</div>

<!-- Add/Edit Row Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add Row</h3>
      <button class="close-x" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="modalCancel">Cancel</button>
      <button class="btn btn-primary btn-sm" id="modalSave">Save Row</button>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div class="img-lightbox-overlay" id="imgLightbox">
  <img id="imgLightboxImg" src="">
</div>

<datalist id="erpCodeDatalist"></datalist>
<div class="toast" id="toast"></div>
<script src="js/01-config-data.js"></script>
<script src="js/02-sheets-config.js"></script>
<script src="js/03-auth-crud.js"></script>
<script src="js/04-compute-actionplan.js"></script>
<script src="js/05-render-table.js"></script>
<script src="js/06-render-rows-nav.js"></script>
<script src="js/07-dashboard-util.js"></script>
</body></html>
