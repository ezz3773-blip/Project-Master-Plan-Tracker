<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>

:root{
  --cream:#F4F6FA;
  --linen:#E9EEF6;
  --paper:#FFFFFF;
  --ink:#0F1E3D;
  --ink-soft:#5B6B85;
  --line:#D6DEEA;
  --terracotta:#1B3A6B;
  --terracotta-deep:#102A50;
  --gold:#3E5C8A;
  --green:#2E7D5B;
  --green-bg:#E1F2EA;
  --amber:#B8863B;
  --amber-bg:#F3E7CD;
  --red:#C0392B;
  --red-bg:#FBE4E1;
  --blue:#1B3A6B;
  --blue-bg:#DCE6F5;
  --purple:#5A4E9E;
  --purple-bg:#E7E4F5;
  --gray:#7A8699;
  --gray-bg:#E9EEF6;
  --serif:'Cormorant Garamond', serif;
  --sans:'DM Sans', sans-serif;
  --radius:10px;
  --shadow:0 2px 12px rgba(15,30,61,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold); color:#fff;}
button{font-family:var(--sans); cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

/* ---------- Auth Screen ---------- */
#authScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 20% 20%, #FFFFFF, var(--cream) 60%);
  padding:24px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--paper); border:1px solid var(--line);
  border-radius:16px; padding:40px 36px; box-shadow:var(--shadow);
}
.auth-card h1{
  font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px;
  color:var(--terracotta-deep); letter-spacing:0.3px;
}
.auth-card p.sub{color:var(--ink-soft); margin:0 0 28px; font-size:14px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:14px; color:var(--ink); outline:none; transition:border-color .15s;
}
.field input:focus{border-color:var(--terracotta);}
.btn{
  border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:600;
  transition:transform .1s, opacity .15s; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--terracotta); color:#fff; width:100%;}
.btn-primary:hover{background:var(--terracotta-deep);}
.btn-ghost{background:transparent; color:var(--terracotta-deep); border:1px solid var(--line);}
.btn-ghost:hover{background:var(--linen);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:7px;}
.auth-toggle{margin-top:18px; text-align:center; font-size:13px; color:var(--ink-soft);}
.auth-toggle a{color:var(--terracotta); cursor:pointer; font-weight:600; text-decoration:none;}
.auth-error{background:var(--red-bg); color:var(--red); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px;}
.auth-logo{width:44px; height:44px; border-radius:12px; background:var(--terracotta); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:22px; font-weight:600; margin-bottom:16px;}

/* ---------- App Shell ---------- */
#app{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--linen); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-header{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.sidebar-header .brand{font-family:var(--serif); font-weight:600; font-size:21px; color:var(--terracotta-deep); line-height:1.15;}
.sidebar-header .brand-sub{font-size:11px; color:var(--ink-soft); letter-spacing:0.08em; text-transform:uppercase; margin-top:3px;}
.nav-group{padding:14px 12px 4px;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft); padding:6px 10px; font-weight:700;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13.5px;
  color:var(--ink); cursor:pointer; margin-bottom:2px; transition:background .12s; font-weight:500;
}
.nav-item:hover{background:#fff;}
.nav-item.active{background:var(--terracotta); color:#fff;}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-soft); flex-shrink:0;}
.nav-item.active .dot{background:#fff;}
.nav-item .count{margin-left:auto; font-size:11px; opacity:0.75; font-variant-numeric:tabular-nums;}
.sidebar-footer{margin-top:auto; padding:14px 16px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft);}
.sidebar-footer .user-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sync-pill{font-size:10.5px; padding:3px 8px; border-radius:20px; background:var(--green-bg); color:var(--green); font-weight:600; display:inline-flex; align-items:center; gap:5px;}
.sync-pill.saving{background:var(--amber-bg); color:var(--amber);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:18px 28px; border-bottom:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  flex-wrap:wrap;
}
.topbar h2{font-family:var(--serif); font-size:24px; font-weight:600; margin:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.content{padding:24px 28px 60px; flex:1;}

.search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-box{position:relative; flex:1; min-width:220px; max-width:340px;}
.search-box input{
  width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:13.5px; outline:none;
}
.search-box input:focus{border-color:var(--terracotta);}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.45;}
.chip{
  padding:6px 12px; border-radius:20px; font-size:12.5px; border:1px solid var(--line); background:#fff;
  color:var(--ink-soft); cursor:pointer; font-weight:600; white-space:nowrap;
}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.table-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow); max-height:calc(100vh - 275px); min-height:160px;}
.drag-handle{cursor:grab; color:var(--ink-soft); text-align:center; touch-action:none; vertical-align:middle;}
.drag-handle:active{cursor:grabbing;}
.drag-handle svg{display:inline-block; vertical-align:middle;}
tr.dragging{opacity:0.4;}
tr.drag-over-top td{box-shadow:inset 0 2px 0 var(--terracotta);}
tr.drag-over-bottom td{box-shadow:inset 0 -2px 0 var(--terracotta);}
@media (max-width:820px){
  .table-wrap{max-height:calc(100vh - 320px);}
}
table{border-collapse:collapse; width:100%; font-size:12.8px;}
thead th{
  position:sticky; top:0; background:var(--linen); text-align:left; padding:10px 30px 10px 12px; font-weight:700;
  color:var(--ink); border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; z-index:2;
  position:relative;
}
.col-resizer{position:absolute; right:0; top:0; bottom:0; width:8px; cursor:col-resize; touch-action:none; z-index:3;}
.col-resizer:hover, .col-resizer:active{background:var(--terracotta); opacity:0.35;}
thead th:hover{background:#DCE6F5;}
thead th .arrow{opacity:0.5; font-size:10px; margin-left:3px;}
tbody td{padding:6px 10px; border-bottom:1px solid #E9EEF6; vertical-align:middle; white-space:nowrap;}
tbody tr:hover{background:#F7F9FC;}
tbody tr:last-child td{border-bottom:none;}
td .cell-input{
  border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:6px; font-size:12.8px;
  width:100%; max-width:100%; color:var(--ink); font-family:var(--sans); box-sizing:border-box;
}
td .cell-input:hover{border-color:var(--line);}
td .cell-input:focus{border-color:var(--terracotta); background:#fff; outline:none;}
td .cell-input[readonly]{color:var(--ink-soft); background:#EEF2F8; cursor:not-allowed;}
select.cell-input{cursor:pointer;}
.rownum{color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:12px; text-align:center; width:34px;}
.row-actions{text-align:center; vertical-align:middle;}
.icon-btn{
  border:none; background:transparent; padding:5px; border-radius:6px; color:var(--ink-soft); display:flex;
}
.icon-btn:hover{background:var(--red-bg); color:var(--red);}

.badge{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11.2px; font-weight:700;
  white-space:nowrap; letter-spacing:0.01em;
}
.b-green{background:var(--green-bg); color:var(--green);}
.b-amber{background:var(--amber-bg); color:var(--amber);}
.b-red{background:var(--red-bg); color:var(--red);}
.b-blue{background:var(--blue-bg); color:var(--blue);}
.b-purple{background:var(--purple-bg); color:var(--purple);}
.b-gray{background:var(--gray-bg); color:var(--gray);}

/* Dashboard */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px; box-shadow:var(--shadow);}
.card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:700;}
.card .value{font-family:var(--serif); font-size:34px; font-weight:600; margin-top:6px; color:var(--ink);}
.card .value.accent{color:var(--terracotta);}
.card .sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:20px;}
.panel h3{font-family:var(--serif); font-size:19px; margin:0 0 14px; font-weight:600;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.8px;}
.bar-label{width:150px; flex-shrink:0; color:var(--ink-soft); font-weight:600;}
.bar-track{flex:1; height:10px; background:var(--linen); border-radius:20px; overflow:hidden;}
.bar-fill{height:100%; border-radius:20px;}
.bar-val{width:40px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-weight:600;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(44,38,30,0.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper); border-radius:14px; width:100%; max-width:640px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-family:var(--serif); margin:0; font-size:21px; font-weight:600;}
.modal-body{padding:20px 24px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.modal-body .field.full{grid-column:1/-1;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.close-x{border:none; background:transparent; font-size:20px; color:var(--ink-soft); line-height:1;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state svg{opacity:0.35; margin-bottom:10px;}

.toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:100; opacity:0; transform:translateY(10px); transition:all .25s;}
.toast.show{opacity:1; transform:translateY(0);}

.hint{font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}
.kebab-menu{position:relative;}
.kebab-dropdown{position:absolute; right:0; top:36px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); min-width:180px; display:none; z-index:10; overflow:hidden;}
.kebab-dropdown.open{display:block;}
.kebab-dropdown button{width:100%; text-align:left; padding:10px 14px; background:none; border:none; font-size:13px; color:var(--ink);}
.kebab-dropdown button:hover{background:var(--linen);}

.menu-btn{display:none; border:none; background:transparent; padding:6px; border-radius:8px; color:var(--ink); flex-shrink:0;}
.menu-btn:hover{background:var(--linen);}
.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(44,38,30,0.35); z-index:39;}
.sidebar-backdrop.open{display:block;}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}

@media (max-width:820px){
  .menu-btn{display:flex;}
  .sidebar{position:fixed; left:-260px; top:0; z-index:40; transition:left .2s; box-shadow:0 0 40px rgba(0,0,0,0.2);}
  .sidebar.open{left:0;}
  .content{padding:16px;}
  .topbar{padding:14px 16px;}
  .modal-body{grid-template-columns:1fr;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .card .value{font-size:26px;}
  .topbar h2{font-size:19px;}
}
@media (max-width:480px){
  .grid-cards{grid-template-columns:1fr 1fr;}
  .auth-card{padding:28px 22px;}
}

/* ---------- V2 additions: project switcher, images, wrap fix ---------- */
.project-switcher{padding:12px 16px 4px; border-bottom:1px solid var(--line);}
.project-btn{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#fff;
  font-size:12.8px; font-weight:600; color:var(--ink); text-align:left;
}
.project-btn:hover{background:var(--paper);}
.project-btn .chev{opacity:0.5; flex-shrink:0;}
.project-list{padding:8px; max-height:280px; overflow-y:auto;}
.project-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:7px;
  font-size:13px; cursor:pointer; margin-bottom:2px;
}
.project-item:hover{background:var(--linen);}
.project-item.active{background:var(--terracotta); color:#fff; font-weight:600;}
.project-item .del-proj{opacity:0.5; padding:2px; border-radius:5px;}
.project-item .del-proj:hover{opacity:1; background:rgba(0,0,0,0.15);}
.new-project-row{padding:8px; border-top:1px solid var(--line);}
.new-project-row input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.8px; margin-bottom:6px;}

/* table layout fix: fixed widths so long text wraps instead of exploding the page */
table{table-layout:fixed;}
tbody td{white-space:normal; overflow-wrap:break-word;}
td .cell-input{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
textarea.cell-input{
  white-space:normal; overflow:hidden; resize:none; line-height:1.4; min-height:30px; font-family:var(--sans);
}
.rownum{white-space:nowrap;}
.badge{white-space:nowrap;}

/* image cell */
.img-cell{display:flex; align-items:center; gap:6px;}
.img-thumb{
  width:34px; height:34px; border-radius:7px; object-fit:cover; border:1px solid var(--line); background:var(--linen); flex-shrink:0; cursor:pointer;
}
.img-placeholder{
  width:34px; height:34px; border-radius:7px; border:1px dashed var(--line); background:var(--linen);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0; cursor:pointer;
}
.img-upload-input{display:none;}
.img-lightbox-overlay{position:fixed; inset:0; background:rgba(20,17,12,0.8); display:none; align-items:center; justify-content:center; z-index:60; padding:30px;}
.img-lightbox-overlay.open{display:flex;}
.img-lightbox-overlay img{max-width:90vw; max-height:85vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.4);}

.list-manager-group{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.list-manager-group:last-child{border-bottom:none;}
.list-manager-title{font-weight:700; font-size:13px; margin-bottom:8px; color:var(--ink);}
.list-manager-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.lm-chip{display:inline-flex; align-items:center; gap:6px; background:var(--linen); border-radius:20px; padding:5px 6px 5px 12px; font-size:12.5px; color:var(--ink);}
.lm-chip button{border:none; background:transparent; color:var(--ink-soft); font-size:15px; line-height:1; padding:2px 4px; border-radius:50%; cursor:pointer;}
.lm-chip button:hover{background:var(--red-bg); color:var(--red);}
.list-manager-add{display:flex; gap:8px;}
.list-manager-add input{flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.8px;}

.ap-group{background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);}
.ap-group-header{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 16px; cursor:pointer; user-select:none;}
.ap-group-header:hover{background:var(--linen);}
.ap-group.ap-group-done .ap-group-header{opacity:0.7;}
.ap-group-title{display:flex; align-items:center; gap:10px; min-width:0;}
.ap-chevron{transition:transform .15s; flex-shrink:0; color:var(--ink-soft);}
.ap-group.open .ap-chevron{transform:rotate(90deg);}
.ap-group-name{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ap-group-code{font-size:11.5px; color:var(--ink-soft); flex-shrink:0;}
.ap-progress{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.ap-progress-track{width:80px; height:7px; background:var(--linen); border-radius:20px; overflow:hidden;}
.ap-progress-fill{height:100%; background:var(--green); border-radius:20px;}
.ap-progress-label{font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}
.ap-group-body{border-top:1px solid var(--line);}
.ap-step-row{display:flex; align-items:center; gap:10px; padding:8px 16px 8px 38px; border-bottom:1px solid #F2F5FA; flex-wrap:wrap;}
.ap-step-row:last-child{border-bottom:none;}
.ap-step-main{flex:1; min-width:160px;}
.ap-step-action{font-size:12.8px; font-weight:600; color:var(--ink);}
.ap-step-type{font-size:11px; color:var(--ink-soft);}
.ap-step-field{width:130px; flex-shrink:0;}
.ap-step-field.narrow{width:110px;}
.ap-step-del{flex-shrink:0;}

.col-filter-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; padding:2px; color:var(--ink-soft); cursor:pointer; z-index:3;}
.col-filter-btn.active{color:var(--terracotta);}
.col-filter-btn:hover{color:var(--terracotta);}
.col-filter-popup{
  position:fixed; background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 12px 32px rgba(15,30,61,0.18);
  width:220px; max-height:320px; display:flex; flex-direction:column; z-index:80;
}
.col-filter-popup .cf-search{padding:8px; border-bottom:1px solid var(--line);}
.col-filter-popup .cf-search input{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;}
.col-filter-popup .cf-actions{display:flex; justify-content:space-between; padding:6px 10px; border-bottom:1px solid var(--line); font-size:11.5px;}
.col-filter-popup .cf-actions a{color:var(--terracotta); cursor:pointer; font-weight:600;}
.col-filter-popup .cf-list{overflow-y:auto; padding:6px 4px; flex:1;}
.col-filter-popup label{display:flex; align-items:center; gap:7px; padding:5px 8px; font-size:12.5px; border-radius:6px; cursor:pointer;}
.col-filter-popup label:hover{background:var(--linen);}
.col-filter-popup .cf-foot{padding:8px; border-top:1px solid var(--line); text-align:right;}
  background:var(--linen); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:12.5px;
  color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:8px;
}

</style>
</head>
<body>
<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">

    <h1 id="authTitle">Production OS</h1>
    <p class="sub">Multi-project manufacturing tracker · Aria Technologies</p>

    <div class="field">

    <div class="field">
      <label>Password</label>

</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">Production OS</div>
        <div class="brand-sub">Multi-project tracker</div>
      </div>
      <div class="project-switcher">
        <button class="project-btn" id="projectSwitcherBtn">
          <span id="currentProjectLabel" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Loading…</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="project-btn" id="listsManagerBtn" style="margin-top:6px;">
          <span>Standard Lists</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
      <nav id="navContainer" style="flex:1; overflow-y:auto;"></nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <span id="userEmailLabel" style="font-weight:600; color:var(--ink); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;"></span>
          <span class="sync-pill" id="syncPill">Synced</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="signOutBtn" style="margin-top:10px; width:100%;">Sign Out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

          <div style="min-width:0;">
            <h2 id="pageTitle">Dashboard</h2>
            <div class="desc" id="pageDesc">Live overview across all sheets</div>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<!-- Project Switcher Modal -->
<div class="modal-overlay" id="projectModalOverlay">

      <button class="close-x" id="projectModalClose">&times;</button>

</div>

</div>

<!-- Add/Edit Row Modal -->
<div class="modal-overlay" id="modalOverlay">

</div>

document.getElementById('authToggle').onclick = () => {

function showLoadErrorScreen(e){
  const msg = (e && e.message) ? e.message : String(e);
  const isPermission = /permission|insufficient/i.test(msg);
  document.getElementById('content').innerHTML = `
    <div class="panel" style="max-width:640px; margin:40px auto;">
      <h3 style="color:var(--red);">Failed to load data</h3>

      ${isPermission ? `
        <p style="font-size:13.5px; margin-bottom:10px;">This usually means one of two things in your Firebase project (<b>${firebaseConfig.projectId}</b>):</p>

          <li><b>Security Rules are blocking access.</b> Firestore Database → Rules, paste:
            <pre style="background:var(--linen); padding:10px 12px; border-radius:8px; font-size:11.5px; overflow-x:auto; margin-top:6px;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /projects/{doc=**} { allow read, write: if request.auth != null; }
  }
}</pre>then click Publish.</li>
        </ol>` : ''}
      <button class="btn btn-primary btn-sm" id="retryLoadBtn" style="margin-top:16px;">Retry</button>
    </div>`;
  document.getElementById('retryLoadBtn').onclick = () => location.reload();
}

/* =====================================================================

   ===================================================================== */
async function loadProjectList(){
  const snap = await db.collection('projects').orderBy('createdAt','asc').get();
  state.projects = snap.docs.map(d => ({id:d.id, ...d.data()}));
}

async function createProject(name, seedFromExcel){
  const ref = await db.collection('projects').add({
    name: name || 'Untitled Project',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  state.projects.push({id:ref.id, name});
  if(seedFromExcel){ await seedProjectFromExcel(ref.id); }
  return ref.id;
}

async function deleteProjectPrompt(id, name){
  if(!confirm(`Delete project "${name}"? This permanently deletes ALL its data (BOM, parts, everything). This cannot be undone.`)) return;
  showToast('Deleting project…');
  // Delete every sheet collection + extras collection for this project.
  const allKeys = [...Object.keys(MANUAL_SHEETS), ...Object.keys(DERIVED_SHEETS).map(k=>k+'Extras')];
  for(const key of allKeys){
    const snap = await db.collection('projects').doc(id).collection(key).get();
    let batch = db.batch(); let n = 0;
    for(const d of snap.docs){ batch.delete(d.ref); n++; if(n===400){ await batch.commit(); batch = db.batch(); n = 0; } }
    if(n>0) await batch.commit();
  }
  await db.collection('projects').doc(id).delete();
  state.projects = state.projects.filter(p => p.id !== id);
  if(state.projectId === id){
    const next = state.projects[0];
    if(next){ await switchProject(next.id); } else { await switchProject(await createProject('MAFI LR-340', false)); }
  }
  renderProjectList();
  showToast('Project deleted.');
}

async function switchProject(id){
  const proj = state.projects.find(p => p.id === id);
  if(!proj) return;
  state.projectId = id;
  state.projectName = proj.name;
  localStorage.setItem('productionOS_lastProject', id);
  document.getElementById('currentProjectLabel').textContent = proj.name;
  showLoadingScreen();
  try{
    await loadAllProjectData();
    buildNav();
    navigateTo('dashboard');
  }catch(e){ showLoadErrorScreen(e); }
}

/* =====================================================================
   GLOBAL STANDARD LISTS (shared across all projects)
   ===================================================================== */
async function loadGlobalLists(){
  state.globalLists = {};
  const snap = await db.collection('globalLists').get();
  const existing = {};
  snap.docs.forEach(d => { existing[d.id] = (d.data().values)||[]; });
  const ops = [];
  Object.keys(GLOBAL_LIST_LABELS).forEach(key => {
    if(existing[key]){
      state.globalLists[key] = existing[key];
    } else {
      const seedVals = (GLOBAL_LISTS_SEED[key]||[]).slice();
      state.globalLists[key] = seedVals;
      ops.push({ref: db.collection('globalLists').doc(key), type:'set', data:{values: seedVals}});
    }
  });
  if(ops.length) await commitInChunksGlobal(ops);
}
async function commitInChunksGlobal(ops){
  for(let i=0; i<ops.length; i+=400){
    const batch = db.batch();
    ops.slice(i,i+400).forEach(op => batch.set(op.ref, op.data, {merge:true}));
    await batch.commit();
  }
}
async function addToGlobalList(listKey, value){
  if(!listKey || !value) return;
  value = String(value).trim();
  if(!value) return;
  state.globalLists[listKey] = state.globalLists[listKey] || [];
  const exists = state.globalLists[listKey].some(v => v.toLowerCase() === value.toLowerCase());
  if(exists) return;
  state.globalLists[listKey].push(value);
  state.globalLists[listKey].sort((a,b)=>a.localeCompare(b));
  try{
    await db.collection('globalLists').doc(listKey).set({values: firebase.firestore.FieldValue.arrayUnion(value)}, {merge:true});
  }catch(e){ /* non-critical */ }
}
async function removeFromGlobalList(listKey, value){
  state.globalLists[listKey] = (state.globalLists[listKey]||[]).filter(v => v !== value);
  try{
    await db.collection('globalLists').doc(listKey).set({values: firebase.firestore.FieldValue.arrayRemove(value)}, {merge:true});
  }catch(e){}
}
function optionsForColumn(sheetKey, col){
  if(col.opts === 'mainProducts') return (state.mainProducts||[]).map(p=>p.name);
  if(col.opts && col.opts.global){
    const global = state.globalLists[col.opts.global] || [];
    const local = distinctValues(sheetKey, col.key);
    const merged = new Set([...global, ...local]);
    return Array.from(merged).sort((a,b)=>String(a).localeCompare(String(b)));
  }
  if(col.opts === 'suggest') return distinctValues(sheetKey, col.key);
  return col.opts;
}

    body.querySelector(`[data-add-input="${key}"]`).addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  });

  return String(v==null?'':v).trim().replace(/[\/\.\#\$\[\]]/g,'_').slice(0,300) || ('row_' + Math.random().toString(36).slice(2));
}

async function commitInChunks(ops){ // ops: [{ref, data, type:'set'|'delete'}]
  for(let i=0; i<ops.length; i+=400){
    const chunk = ops.slice(i, i+400);
    const batch = db.batch();
    chunk.forEach(op => { if(op.type==='delete') batch.delete(op.ref); else batch.set(op.ref, op.data, {merge:true}); });
    await batch.commit();
  }
}

async function loadAllProjectData(){
  state.sheets = {}; state.extras = {}; state.mainProducts = [];
  for(const key of Object.keys(MANUAL_SHEETS)){
    const snap = await colRef(key).get();

async function ensureOrderIndexes(sheetKey){
  const rows = state.sheets[sheetKey] || [];
  const ops = [];
  rows.forEach((r,i) => {
    if(r.orderIndex === undefined || r.orderIndex === null || r.orderIndex === ''){
      r.orderIndex = i*10;
      ops.push({ref: colRef(sheetKey).doc(r.id), type:'set', data:{orderIndex: r.orderIndex}});
    }
  });
  if(ops.length) await commitInChunks(ops);
}

// Part Master defaults to BOM Master's row order (until you drag-reorder it
// yourself in Part Master, after which it stays independent).
async function ensurePartMasterOrderIndexes(){
  const rows = state.sheets.partMaster || [];
  const bomByCode = {};
  (state.sheets.bomMaster||[]).forEach(b => { if(b.erpCode) bomByCode[b.erpCode] = b; });

  rows.forEach((r,i) => {
    if(r.orderIndex === undefined || r.orderIndex === null || r.orderIndex === ''){

      ops.push({ref: colRef('partMaster').doc(r.id), type:'set', data:{orderIndex: r.orderIndex}});
    }
  });
  if(ops.length) await commitInChunks(ops);
}

async function seedProjectFromExcel(projectId){

/* ---- Manual sheet row edits ---- */
function updateRowField(sheetKey, rowId, field, value){
  const row = (state.sheets[sheetKey]||[]).find(r => r.id === rowId);
  if(row) row[field] = value;
  setSyncState('saving');
  const timerKey = sheetKey+'|'+rowId+'|'+field;
  clearTimeout(saveTimers[timerKey]);
  saveTimers[timerKey] = setTimeout(async () => {
    try{
      await colRef(sheetKey).doc(rowId).set({[field]: value}, {merge:true});
      setSyncState('synced');
      if(sheetKey === 'bomMaster' && (field==='erpCode'||field==='description')) refreshErpDatalist();
    }catch(e){ setSyncState('error'); showToast('Save failed: ' + e.message); }

async function addManualRow(sheetKey, data){
  if(sheetCfg(sheetKey).reorderable && (data.orderIndex === undefined || data.orderIndex === '')){
    const rows = state.sheets[sheetKey] || [];
    const maxIdx = rows.reduce((m,r) => Math.max(m, Number(r.orderIndex)||0), -10);
    data.orderIndex = maxIdx + 10;
  }
  const ref = await colRef(sheetKey).add(data);
  const row = {id: ref.id, ...data};
  state.sheets[sheetKey] = state.sheets[sheetKey] || [];

  if(sheetKey === 'bomMaster' && data.erpCode){ await ensurePartMasterRow(data.erpCode); refreshErpDatalist(); }
  if(sheetKey === 'partMaster' && data.erpCode){ await ensureBomMasterRow(data.erpCode, data); }
  return row;
}

async function deleteManualRow(sheetKey, rowId){

}

// Natural key(s) used to detect "this is the same row" during CSV import,
// so re-importing an updated sheet UPDATES matching rows instead of duplicating them.
const IMPORT_KEYS = {
  bomMaster: ['erpCode'],
  partMaster: ['erpCode'],
  actionPlan: ['erpCode','action'],
  erpAudit: ['auditItem'],
  changeIssues: ['logNo'],
  kpis: ['kpi'],
};

async function upsertManualRow(sheetKey, data){
  const keys = IMPORT_KEYS[sheetKey];
  if(keys){
    const keyOf = (obj) => keys.map(k => String(obj[k]||'').trim().toLowerCase()).join('|');
    const targetKey = keyOf(data);
    const blankKey = keys.map(()=>'').join('|');
    if(targetKey !== blankKey){
      const existing = (state.sheets[sheetKey]||[]).find(r => keyOf(r) === targetKey);
      if(existing){
        Object.keys(data).forEach(k => {
          if(data[k] !== '' && data[k] !== undefined && data[k] !== null){
            updateRowField(sheetKey, existing.id, k, data[k]);
          }
        });
        return existing;
      }
    }
  }
  return await addManualRow(sheetKey, data);
}

async function cascadeDeleteByErpCode(erpCode){

}

<script>
/* =====================================================================
   LOOKUPS (BOM Master -> Part Master / Action Plan)
   ===================================================================== */
const HOURS_PER_DAY = 7; // your real working day length, used for all lead-time conversions
function applyLookup(sheetKey, row){
  const cfg = sheetCfg(sheetKey);
  if(!cfg.lookups) return row;
  cfg.lookups.forEach(lk => {
    const src = state.sheets[lk.from] || [];
    const code = row[lk.key];
    if(!code) return;
    const match = src.find(r => (r.erpCode||'').toLowerCase() === String(code).toLowerCase());
    if(match){
      Object.entries(lk.map).forEach(([destKey, srcKey]) => {
        row[destKey] = match[srcKey] !== undefined ? match[srcKey] : row[destKey];
      });
      // BOM Master captures lead time in hours PER UNIT; Part Master's Lead Time (days)
      // is the TOTAL for the required quantity, converted at 7 working hours per day.
      if(sheetKey === 'partMaster' && lk.from === 'bomMaster'){
        row.leadTimePerItemDays = Math.round((num(match.leadTimeHours) * num(row.totalRequiredQuantity) / HOURS_PER_DAY) * 100) / 100;
      }
    }
  });
  return row;
}

/* =====================================================================
   FORMULAS
   ===================================================================== */
// Egypt work week: Friday & Saturday are weekend.
function addWorkingDays(startDate, days){
  if(!startDate || isNaN(days)) return null;
  let d = new Date(startDate);
  let remaining = Math.round(days);
  const step = remaining >= 0 ? 1 : -1;
  remaining = Math.abs(remaining);
  while(remaining > 0){
    d.setDate(d.getDate() + step);
    const dow = d.getDay();
    if(dow !== 5 && dow !== 6) remaining--;
  }
  return d;
}
function fmtDate(d){ return d ? d.toISOString().slice(0,10) : ''; }

function computeGapStatus(req, stock, floor, mo, po){
  if(req === 0) return 'NOT REQUIRED';
  if(floor+mo+po >= req) return 'ON FLOOR';
  if(stock >= req) return 'IN WAREHOUSE';
  if(stock+floor === 0) return po>0 ? 'ON ORDER' : 'SHORTAGE';
  return 'PARTIAL';
}
function computeGapRow(row){
  const req = num(row.totalRequiredQuantity), stock = num(row.onHandStock), floor = num(row.onHandInternalLocation);
  const mo = num(row.moIssuedQuantity), po = num(row.poOrderQuantity);
  const covered = stock + floor + mo + po;
  row.netGap = Math.round((covered - req)*100)/100;
  row.coverage = req===0 ? 1 : Math.round((covered/req)*10000)/10000;
  row.totalCost = Math.round((num(row.unitCost) * req)*100)/100;
  row.status = !row.erpCode ? '' : computeGapStatus(req, stock, floor, mo, po);
}
function computeInternalRow(row){
  row.requstedQty = Math.max(0, Math.round((num(row.totalRequiredQuantity) - num(row.onHandInternalLocation))*100)/100);
  if(row.requestDate && row.receiptDate){
    row.delayDays = Math.round((new Date(row.receiptDate) - new Date(row.requestDate)) / 86400000);
  } else if(row.requestDate){
    const d = Math.round((new Date() - new Date(row.requestDate)) / 86400000);
    row.delayDays = d>0 ? d : 0;
  } else row.delayDays = '';
}
function computePurchasingRow(row){
  row.qtyToOrder = Math.max(0, Math.round((num(row.totalRequiredQuantity) - num(row.onHandStock))*100)/100);
  if(row.promisedDate && row.actualReceiptDate){
    row.delayDays = Math.round((new Date(row.actualReceiptDate) - new Date(row.promisedDate)) / 86400000);
  } else if(row.promisedDate){
    const d = Math.round((new Date() - new Date(row.promisedDate)) / 86400000);
    row.delayDays = d>0 ? d : 0;
  } else row.delayDays = '';
}
// Finds the direct material/child component of a manufactured part: the very
// next row in BOM Master's order whose level is exactly one deeper. This assumes
// your BOM Master is organized so a part's material immediately follows it.
function findDirectMaterial(erpCode){
  const bom = (state.sheets.bomMaster||[]).slice().sort((a,b) => (Number(a.orderIndex)||0) - (Number(b.orderIndex)||0));
  const idx = bom.findIndex(b => b.erpCode === erpCode);
  if(idx === -1) return null;
  const parentLvl = Number(bom[idx].lvl)||0;
  const next = bom[idx+1];
  if(next && Number(next.lvl) === parentLvl+1) return next;
  return null;
}

function computeProductionRow(row){
  const qty = num(row.prodOrderNo), leadEa = num(row.leadTimeEaDays);
  row.totalLeadTimeHours = Math.round(qty * leadEa * HOURS_PER_DAY * 100)/100;
  if(row.startDatePlan && row.totalLeadTimeHours){
    row.endDatePlan = fmtDate(addWorkingDays(row.startDatePlan, row.totalLeadTimeHours/HOURS_PER_DAY));
  } else row.endDatePlan = '';
  if(row.endDatePlan && row.endDateActual){
    const d = Math.round((new Date(row.endDateActual) - new Date(row.endDatePlan)) / 86400000);
    row.varianceDays = d>0 ? ('+'+d+' days') : (d<0 ? (d+' days') : 'On Time');
  } else row.varianceDays = '';

  const material = findDirectMaterial(row.erpCode);
  if(material){
    row.materialErpCode = material.erpCode || '';
    row.materialDescription = material.description || '';
    row.materialUom = material.uom || '';
    const neededQty = num(material.qtyPerEach) * (num(row.prodOrderNo) || num(row.totalRequiredQuantity));
    row.materialQty = Math.round(neededQty*100)/100;
    const matPart = (state.sheets.partMaster||[]).find(x => x.erpCode === material.erpCode);
    const matStock = matPart ? (num(matPart.onHandStock)+num(matPart.onHandInternalLocation)) : 0;
    row.materialReadiness = neededQty<=0 ? '' : (matStock >= neededQty ? 'READY' : (matStock>0 ? 'PARTIAL' : 'NOT READY'));
  } else {
    row.materialErpCode = ''; row.materialDescription = ''; row.materialUom = ''; row.materialQty = ''; row.materialReadiness = '';
  }
}

/* =====================================================================
   DERIVE ROWS FOR AUTO-GENERATED SHEETS
   ===================================================================== */
function deriveRows(sheetKey){
  const cfg = DERIVED_SHEETS[sheetKey];
  const pm = state.sheets.partMaster || [];
  const bomByCode = {};
  (state.sheets.bomMaster||[]).forEach(b => { if(b.erpCode) bomByCode[b.erpCode] = b; });
  const extras = state.extras[sheetKey] || {};
  const rows = pm.filter(p => p.erpCode && cfg.filter(p)).map(p => {
    const b = bomByCode[p.erpCode] || {};
    const row = {
      erpCode: p.erpCode,
      description: b.description || p.description || '',
      partNo: b.partNumber || p.partNo || '',
      level: b.lvl !== undefined ? b.lvl : '',
      makebuy: p.makebuy || '',
      preferredSupplier: p.preferredSupplier || '',
      totalRequiredQuantity: p.totalRequiredQuantity || 0,
      onHandStock: p.onHandStock || 0,
      onHandInternalLocation: p.onHandInternalLocation || 0,
      uom: p.uom || '',
      leadTimeDays: p.leadTimePerItemDays || 0,
      leadTimeEaDays: p.leadTimePerItemDays || 0,
      unitCost: p.unitCost || 0,
      preferedMethodOfManufacturing: p.preferedMethodOfManufacturing || '',
      imageBase64: p.imageBase64 || '',
      orderIndex: p.orderIndex !== undefined ? p.orderIndex : 999999,
      ...(extras[p.erpCode] || {}),
    };
    if(sheetKey === 'gapAnalysis') computeGapRow(row);
    if(sheetKey === 'internalRequests') computeInternalRow(row);
    if(sheetKey === 'purchasingTracker') computePurchasingRow(row);
    if(sheetKey === 'productionSchedule') computeProductionRow(row);
    return row;
  });
  return rows;
}

/* =====================================================================
   ACTION PLAN — STANDARD STEP TEMPLATES, following your real workflow:
   1) Every item's first stage is getting it coded (Item Data Folder + Coding Request).
   2) Already on the floor (fully available): nothing further, unless it still needs
      external processing — then just request that.
   3) Already in warehouse stock: just request it to the floor (+ ext. process if needed).
   4) Shortage/partial + Make: Material Request → MO → Job Order → manufacture →
      close MO/Job Order → then external process request if needed.
   5) Shortage/partial + Buy (or on order): raise the request and follow up the PO
      → then external process request if needed.
   ===================================================================== */
function standardStepsFor(p, gapStatus){
  const steps = [];
  steps.push({executionType:'Production Control', action:'Item Data Folder'});
  steps.push({executionType:'Production Control', action:'Coding Request'});

  const needsExt = p.isThisItemNeedExternalOperations === 'Yes';
  const extSteps = () => {
    steps.push({executionType:'Production Control', action:'Service Request (Coating)'});
    steps.push({executionType:'Subcontracted Operations', action:'Coating'});
  };

  if(gapStatus === 'ON FLOOR' || gapStatus === 'NOT REQUIRED'){
    // already fully available — only an external process request, if flagged
    if(needsExt) extSteps();
  } else if(gapStatus === 'IN WAREHOUSE'){
    // already in stock — just needs to be requested to the floor
    steps.push({executionType:'Production Control', action:'Material Request'});
    if(needsExt) extSteps();
  } else if(p.makebuy === 'Make'){
    // shortage/partial, manufactured internally
    steps.push({executionType:'Production Control', action:'Material Request'});
    steps.push({executionType:'Production Control', action:'MO Issue'});
    steps.push({executionType:'Production Control', action:'Job Order Issue'});
    const method = p.preferedMethodOfManufacturing;
    if(method && method !== 'N/A' && method !== 'Assembling'){
      steps.push({executionType:'Internal Manufacturing', action: method});
    }
    if(method === 'Assembling'){
      steps.push({executionType:'Assembly Operations', action:'Assembling'});
    }
    steps.push({executionType:'Production Control', action:'MO Close'});
    steps.push({executionType:'Production Control', action:'Job Order Close'});
    if(needsExt) extSteps();
  } else {
    // shortage/partial/on order, bought or sourced externally — request + follow the PO
    steps.push({executionType:'Production Control', action:'Request Issuing'});
    steps.push({executionType:'Production Control', action:'PO Follow-up'});
    if(needsExt) extSteps();
  }
  return steps;
}

async function generateActionPlanSteps(){
  const pm = state.sheets.partMaster || [];
  const bomByCode = {};
  (state.sheets.bomMaster||[]).forEach(b => { if(b.erpCode) bomByCode[b.erpCode] = b; });
  const gapExtras = state.extras.gapAnalysis || {};
  const existing = new Set((state.sheets.actionPlan||[]).map(r => (r.erpCode||'') + '|' + (r.action||'')));
  const needing = pm.filter(p => p.erpCode && num(p.totalRequiredQuantity) > 0);
  const ops = [];
  needing.forEach(p => {
    const b = bomByCode[p.erpCode] || {};
    const ex = gapExtras[p.erpCode] || {};
    const gapStatus = computeGapStatus(num(p.totalRequiredQuantity), num(p.onHandStock), num(p.onHandInternalLocation), num(ex.moIssuedQuantity), num(ex.poOrderQuantity));
    standardStepsFor(p, gapStatus).forEach(s => {
      const k = p.erpCode + '|' + s.action;
      if(existing.has(k)) return;
      existing.add(k);
      addToGlobalList('actions', s.action);
      addToGlobalList('executionTypes', s.executionType);
      ops.push({ref: colRef('actionPlan').doc(), type:'set', data:{
        erpCode: p.erpCode, partName: b.description||p.description||'', partNumber: b.partNumber||p.partNo||'',
        category: b.category||p.category||'', material: b.material||p.material||'',
        executionType: s.executionType, action: s.action, currentStatus:'Not Started',
        axis:'', itemNo:'', qty:'', supplierSubcon:'', refNoMopo:'', waitingFor:'', responsible:'',
        targetDate:'', actualDate:'', sentDate:'', expReturn:'', received:'', remarks:''
      }});
    });
  });
  if(!ops.length){ showToast('No new steps to generate — everything up to date.'); return; }
  showToast('Generating ' + ops.length + ' step(s)…');
  await commitInChunks(ops);
  const snap = await colRef('actionPlan').get();
  state.sheets.actionPlan = snap.docs.map(d => ({id:d.id, ...d.data()}));
  render();
  showToast(ops.length + ' action step(s) generated.');
}

/* =====================================================================
   IMAGE HELPERS
   ===================================================================== */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
document.getElementById('imgLightbox').onclick = () => document.getElementById('imgLightbox').classList.remove('open');

<script>
/* =====================================================================
   ROW ACCESS HELPERS
   ===================================================================== */
function getRows(sheetKey){
  if(isManual(sheetKey)){
    const rows = state.sheets[sheetKey] || [];
    const cfg = sheetCfg(sheetKey);
    if(cfg.lookups) return rows.map(r => applyLookup(sheetKey, {...r}));
    return rows;
  }
  return deriveRows(sheetKey);
}
function rowIdentity(sheetKey, row){ return isManual(sheetKey) ? row.id : row.erpCode; }

function distinctValues(sheetKey, colKey){
  const set = new Set();
  getRows(sheetKey).forEach(r => { if(r[colKey] !== undefined && r[colKey] !== null && r[colKey] !== '') set.add(r[colKey]); });
  return Array.from(set).sort();
}

/* =====================================================================
   NAV
   ===================================================================== */
function buildNav(){
  const nav = document.getElementById('navContainer');
  let html = `<div class="nav-group"><div class="nav-item" data-nav="dashboard"><span class="dot"></span>Dashboard</div></div>`;
  GROUPS.forEach(g => {
    const keys = SHEET_ORDER.filter(k => sheetCfg(k).group === g);
    if(!keys.length) return;
    html += `<div class="nav-group"><div class="nav-group-label">${g}</div>`;
    keys.forEach(k => {
      html += `<div class="nav-item" data-nav="${k}"><span class="dot"></span>${sheetCfg(k).label}<span class="count">${getRows(k).length}</span></div>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el => { el.onclick = () => navigateTo(el.getAttribute('data-nav')); });
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.getAttribute('data-nav') === state.current));
}

function navigateTo(key){
  state.current = key; state.search = ''; state.statusFilter = null; state.sortKey = null; state.columnFilters = {};
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
  render();
}

/* =====================================================================
   RENDER DISPATCH
   ===================================================================== */
function render(){
  const titleEl = document.getElementById('pageTitle');
  const descEl = document.getElementById('pageDesc');
  const actionsEl = document.getElementById('topbarActions');
  if(state.current === 'dashboard'){
    titleEl.textContent = state.projectName || 'Dashboard';
    descEl.textContent = 'Live overview across all sheets';
    actionsEl.innerHTML = '';
    renderDashboard();
  } else {
    const cfg = sheetCfg(state.current);
    titleEl.textContent = cfg.label;
    descEl.textContent = cfg.desc || '';
    const manual = isManual(state.current);
    actionsEl.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="exportBtn">Export CSV</button>
      ${manual ? `<button class="btn btn-ghost btn-sm" id="importBtn">Import CSV</button><input type="file" accept=".csv,text/csv" id="importFileInput" style="display:none;">` : ''}
      ${state.current==='partMaster' ? `<button class="btn btn-ghost btn-sm" id="syncBomBtn">Sync from BOM Master</button><button class="btn btn-ghost btn-sm" id="dedupeBtn">Remove Duplicates</button><button class="btn btn-ghost btn-sm" id="checkSyncBtn">Check Sync</button>` : ''}
      ${state.current==='actionPlan' ? `<button class="btn btn-ghost btn-sm" id="genStepsBtn">Generate Steps</button><button class="btn btn-ghost btn-sm" id="apViewToggleBtn">${state.actionPlanGrouped?'Flat Table':'Group by Part'}</button>` : ''}
      ${manual ? `<button class="btn btn-primary btn-sm" id="addRowBtn">+ Add Row</button>` : ''}
    `;
    document.getElementById('exportBtn').onclick = () => exportCSV(state.current);
    if(manual) document.getElementById('addRowBtn').onclick = () => openRowModal(state.current);
    if(manual){
      document.getElementById('importBtn').onclick = () => document.getElementById('importFileInput').click();
      document.getElementById('importFileInput').onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if(file) await importCSVFile(state.current, file);
      };
    }
    if(state.current==='partMaster'){
      document.getElementById('syncBomBtn').onclick = syncPartMasterFromBom;
      document.getElementById('dedupeBtn').onclick = dedupePartMaster;
      document.getElementById('checkSyncBtn').onclick = checkSyncReport;
    }
    if(state.current==='actionPlan'){
      document.getElementById('genStepsBtn').onclick = generateActionPlanSteps;
      document.getElementById('apViewToggleBtn').onclick = () => { state.actionPlanGrouped = !state.actionPlanGrouped; render(); };
    }
    renderTable(state.current);
  }
  buildNav();
}

/* =====================================================================
   BADGE COLOR
   ===================================================================== */
function badgeClass(val){
  if(val === null || val === undefined || val === '') return 'b-gray';
  const v = String(val).toLowerCase();
  if(/(shortage|open|not started|blocked|delay|fail|high|obsolete|cancelled|not ready)/.test(v)) return 'b-red';
  if(/(progress|partial|warehouse|medium|pending|waiting|mo issued|released|pr raised)/.test(v)) return 'b-amber';
  if(/(complete|done|closed|floor|active|low$|received|covered|pass|ready)/.test(v)) return 'b-green';
  if(/(order|sent|inactive)/.test(v)) return 'b-blue';
  if(/(hold|critical|discontinued|not required)/.test(v)) return 'b-purple';
  return 'b-gray';
}

/* =====================================================================
   TABLE ENGINE
   ===================================================================== */
function renderTable(sheetKey){
  if(sheetKey === 'actionPlan' && state.actionPlanGrouped){ renderActionPlanGrouped(); return; }
  const cfg = sheetCfg(sheetKey);
  const manual = isManual(sheetKey);
  const content = document.getElementById('content');
  let rows = getRows(sheetKey).slice();

  if(state.search){
    const q = state.search.toLowerCase();
    rows = rows.filter(r => cfg.columns.some(c => String(r[c.key]||'').toLowerCase().includes(q)));
  }
  if(state.statusFilter && cfg.statusField){
    rows = rows.filter(r => String(r[cfg.statusField]||'') === state.statusFilter);
  }
  const activeColFilters = state.columnFilters[sheetKey] || {};
  const hasColFilters = Object.values(activeColFilters).some(set => set && set.size);
  Object.entries(activeColFilters).forEach(([colKey, set]) => {
    if(set && set.size) rows = rows.filter(r => set.has(String(r[colKey] ?? '')));
  });
  const dragEnabled = !!(cfg.reorderable && !state.search && !state.statusFilter && !state.sortKey && !hasColFilters);
  if(cfg.reorderable && !state.sortKey){
    rows.sort((a,b) => (Number(a.orderIndex)||0) - (Number(b.orderIndex)||0));
  } else if(cfg.followOrderOf && !state.sortKey){
    const refRows = state.sheets[cfg.followOrderOf] || [];
    const orderMap = {};
    refRows.forEach(r => { if(r.erpCode) orderMap[r.erpCode] = Number(r.orderIndex)||0; });
    rows.sort((a,b) => (orderMap[a.erpCode] ?? 999999) - (orderMap[b.erpCode] ?? 999999));
  } else if(state.sortKey){
    rows.sort((a,b) => {
      const av = a[state.sortKey], bv = b[state.sortKey];
      if(av === undefined || av === null || av==='') return 1;
      if(bv === undefined || bv === null || bv==='') return -1;
      if(!isNaN(av) && !isNaN(bv)) return (Number(av)-Number(bv)) * state.sortDir;
      return String(av).localeCompare(String(bv)) * state.sortDir;
    });
  }

  const totalCount = getRows(sheetKey).length;
  const statusChips = cfg.statusField ? distinctValues(sheetKey, cfg.statusField) : [];

  let html = '';
  if(sheetKey === 'partMaster') html += renderMainProductsPanel();
  if(sheetKey === 'gapAnalysis') html += renderNotCodedBanner();
  html += `<div class="search-row">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search ${cfg.label.toLowerCase()}…" value="${escapeHtml(state.search)}">
    </div>`;
  if(statusChips.length){
    html += `<span class="chip ${!state.statusFilter?'active':''}" data-chip="">All (${totalCount})</span>`;
    statusChips.forEach(s => {
      const count = getRows(sheetKey).filter(r => String(r[cfg.statusField]) === String(s)).length;
      html += `<span class="chip ${state.statusFilter===s?'active':''}" data-chip="${escapeHtml(s)}">${escapeHtml(s)} (${count})</span>`;
    });
  }
  html += `</div>`;

  if(!manual){
    html += `<div class="readonly-hint">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      Rows here are generated automatically from Part Master. To add or remove a part from this list, update its quantities in Part Master — only the highlighted fields below are yours to fill in.${cfg.reorderable?' Drag ⠿ to arrange the order.':''}
    </div>`;
  }
  if(cfg.reorderable && !dragEnabled){
    html += `<div class="readonly-hint">Clear search/filter/sort to drag-reorder rows.</div>`;
  }

  if(!rows.length){
    html += `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <div>${totalCount===0 ? (manual?'No rows yet. Add one to get started.':'Nothing here yet — it will appear automatically once Part Master has matching parts.') : 'No rows match your search/filter.'}</div>
    </div>`;
    content.innerHTML = html;
    wireSearchAndChips(sheetKey);
    if(sheetKey === 'partMaster') wireMainProductsPanel();
    if(sheetKey === 'gapAnalysis') wireNotCodedBanner();
    return;
  }

  html += `<div class="table-wrap"><table><thead><tr>`;
  if(dragEnabled) html += `<th style="width:28px"></th>`;
  html += `<th class="rownum">#</th>`;
  const colWidths = getColWidths(sheetKey);
  cfg.columns.forEach(c => {
    const arrow = state.sortKey === c.key ? (state.sortDir===1?'▲':'▼') : '';
    const w = colWidths[c.key] || c.w;
    const isFiltered = activeColFilters[c.key] && activeColFilters[c.key].size;
    html += `<th style="width:${w}px" data-sort="${c.key}">${c.label} <span class="arrow">${arrow}</span><button class="col-filter-btn ${isFiltered?'active':''}" data-filter-col="${c.key}" title="Filter"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button><span class="col-resizer" data-colkey="${c.key}"></span></th>`;
  });
  if(manual) html += `<th style="width:40px"></th>`;
  html += `</tr></thead><tbody>`;

  rows.forEach((row, i) => {
    const rid = rowIdentity(sheetKey, row);
    html += `<tr data-rowid="${escapeHtml(rid)}" ${dragEnabled?'draggable="true"':''}>`;
    if(dragEnabled){
      html += `<td class="drag-handle" title="Drag to reorder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>
      </td>`;
    }
    html += `<td class="rownum">${i+1}</td>`;
    cfg.columns.forEach(c => { html += `<td>${renderCell(sheetKey, row, c, manual?'manual':'derived')}</td>`; });
    if(manual){
      html += `<td class="row-actions"><button class="icon-btn" data-del="${escapeHtml(rid)}" title="Delete row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button></td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  html += cfg.columns.filter(c => c.kind==='select' && (c.opts==='suggest' || c.opts==='mainProducts' || (c.opts && c.opts.global))).map(c => {
    const opts = optionsForColumn(sheetKey, c);
    return `<datalist id="dl_${sheetKey}_${c.key}">${opts.map(o=>`<option value="${escapeHtml(o)}">`).join('')}</datalist>`;
  }).join('');
  html += `<div class="hint">${rows.length} of ${totalCount} row${totalCount===1?'':'s'} shown · shaded fields are read-only (auto-filled) · click a column header to sort${dragEnabled?' · drag ⠿ to reorder':''}</div>`;

  content.innerHTML = html;
  wireSearchAndChips(sheetKey);
  if(sheetKey === 'partMaster') wireMainProductsPanel();
  if(sheetKey === 'gapAnalysis') wireNotCodedBanner();
  if(dragEnabled) wireDragReorder(sheetKey);

  content.querySelectorAll('th[data-sort]').forEach(el => {
    el.onclick = () => {
      if(el.dataset.justResized){ delete el.dataset.justResized; return; }
      const k = el.getAttribute('data-sort');
      if(state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
      renderTable(sheetKey);
    };
  });
  wireColumnResize(sheetKey);
  wireColumnFilters(sheetKey);
  if(manual){
    content.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = async () => {
        const rid = el.getAttribute('data-del');
        const isBom = sheetKey === 'bomMaster';
        const row = isBom ? (state.sheets.bomMaster||[]).find(r => r.id === rid) : null;
        const msg = isBom
          ? 'Delete this part from BOM Master? Its matching Part Master row (and any gap analysis / purchasing / production data for it) will be deleted too.'
          : 'Delete this row?';
        if(confirm(msg)){
          await deleteManualRow(sheetKey, rid);
          if(isBom && row && row.erpCode) await cascadeDeleteByErpCode(row.erpCode);
          renderTable(sheetKey); buildNav();
        }
      };
    });
  }
  wireCellInputs();
  wireImageInputs();
}

let dragState = { fromId: null };

function wireDragReorder(sheetKey){
  const trs = document.querySelectorAll('#content tbody tr[draggable="true"]');
  const clearIndicators = () => document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
  trs.forEach(tr => {
    tr.addEventListener('dragstart', () => {
      dragState.fromId = tr.getAttribute('data-rowid');
      tr.classList.add('dragging');
    });
    tr.addEventListener('dragend', () => { tr.classList.remove('dragging'); clearIndicators(); dragState.fromId = null; });
    tr.addEventListener('dragover', (e) => {
      e.preventDefault();
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      clearIndicators();
      tr.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });
    tr.addEventListener('drop', async (e) => {
      e.preventDefault();
      const toId = tr.getAttribute('data-rowid');
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      clearIndicators();
      const fromId = dragState.fromId;
      dragState.fromId = null;
      if(!fromId || fromId === toId) return;
      await reorderRows(sheetKey, fromId, toId, before);
    });
  });
}

async function reorderRows(sheetKey, fromId, toId, before){
  const manual = isManual(sheetKey);
  const rows = (manual ? (state.sheets[sheetKey]||[]) : deriveRows(sheetKey)).slice()
    .sort((a,b) => (Number(a.orderIndex)||0) - (Number(b.orderIndex)||0));
  const idOf = r => manual ? r.id : r.erpCode;
  const fromIdx = rows.findIndex(r => idOf(r) === fromId);
  if(fromIdx === -1) return;
  const [moved] = rows.splice(fromIdx, 1);
  let toIdx = rows.findIndex(r => idOf(r) === toId);
  if(toIdx === -1) toIdx = rows.length; else if(!before) toIdx += 1;
  rows.splice(toIdx, 0, moved);
  const ops = [];
  state.extras[sheetKey] = state.extras[sheetKey] || {};
  rows.forEach((r,i) => {
    const newIdx = i*10;
    if(Number(r.orderIndex) !== newIdx){
      r.orderIndex = newIdx;
      if(manual){
        ops.push({ref: colRef(sheetKey).doc(r.id), type:'set', data:{orderIndex:newIdx}});
      } else {
        state.extras[sheetKey][r.erpCode] = state.extras[sheetKey][r.erpCode] || {};
        state.extras[sheetKey][r.erpCode].orderIndex = newIdx;
        ops.push({ref: extrasRef(sheetKey).doc(sanitizeId(r.erpCode)), type:'set', data:{orderIndex:newIdx}});
      }
    }
  });
  if(manual) state.sheets[sheetKey] = rows;
  renderTable(sheetKey);
  if(ops.length) await commitInChunks(ops);
}

function getColWidths(sheetKey){
  try{ return JSON.parse(localStorage.getItem('colw_'+sheetKey) || '{}'); }catch(e){ return {}; }
}
function setColWidth(sheetKey, key, px){
  const w = getColWidths(sheetKey);
  w[key] = px;
  try{ localStorage.setItem('colw_'+sheetKey, JSON.stringify(w)); }catch(e){}
}
function wireColumnResize(sheetKey){
  document.querySelectorAll('.col-resizer').forEach(handle => {
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      const th = handle.closest('th');
      const startX = e.clientX;
      const startWidth = th.getBoundingClientRect().width;
      let moved = false;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      function onMove(e2){
        const delta = e2.clientX - startX;
        if(Math.abs(delta) > 3) moved = true;
        th.style.width = Math.max(40, Math.round(startWidth + delta)) + 'px';
      }
      function onUp(e2){
        try{ handle.releasePointerCapture(e2.pointerId); }catch(err){}
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        if(moved){
          setColWidth(sheetKey, handle.getAttribute('data-colkey'), Math.round(th.getBoundingClientRect().width));
          th.dataset.justResized = '1';
        }
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  });
}

let syncInFlight = false;
async function syncPartMasterFromBom(){
  if(syncInFlight){ showToast('Sync already in progress…'); return; }
  syncInFlight = true;
  try{
    const bom = state.sheets.bomMaster || [];
    const existingCodes = new Set((state.sheets.partMaster||[]).map(r => (r.erpCode||'').trim().toLowerCase()));
    const missing = bom.filter(b => b.erpCode && !existingCodes.has(b.erpCode.trim().toLowerCase()));
    if(!missing.length){ showToast('Part Master is already in sync — nothing to add.'); return; }
    showToast('Syncing ' + missing.length + ' missing part(s)…');
    const seen = new Set();
    for(const b of missing){
      const code = b.erpCode.trim().toLowerCase();
      if(seen.has(code)) continue;
      seen.add(code);
      await ensurePartMasterRow(b.erpCode);
    }
    renderTable('partMaster'); buildNav();
    showToast(missing.length + ' part(s) added to Part Master.');
  } finally { syncInFlight = false; }
}

// Cleans up duplicate Part Master rows that may have accumulated before the
// upsert fix — keeps one row per ERP code, merging in any filled-in fields
// from the duplicates before deleting them (so no data is lost).
async function dedupePartMaster(){
  const rows = state.sheets.partMaster || [];
  const groups = {};
  rows.forEach(r => {
    const code = (r.erpCode||'').trim().toLowerCase();
    if(!code) return;
    groups[code] = groups[code] || [];
    groups[code].push(r);
  });
  const dupGroups = Object.values(groups).filter(g => g.length > 1);
  if(!dupGroups.length){ showToast('No duplicates found.'); return; }
  const dupCount = dupGroups.reduce((s,g)=>s+g.length-1, 0);
  if(!confirm(`Found ${dupGroups.length} part(s) with duplicate rows (${dupCount} extra row(s) total). Merge and remove the duplicates? Any filled-in data on the extra rows will be kept on the row that stays.`)) return;
  const ops = [];
  const removedIds = new Set();
  const filledCount = (r) => Object.values(r).filter(v => v!==undefined && v!==null && v!=='').length;
  for(const group of dupGroups){
    const keeper = group.reduce((best, r) => filledCount(r) > filledCount(best) ? r : best, group[0]);
    const others = group.filter(r => r.id !== keeper.id);
    const merged = {};
    others.forEach(r => {
      Object.keys(r).forEach(k => {
        if(k==='id') return;
        if((keeper[k]===undefined||keeper[k]===null||keeper[k]==='') && r[k]!==undefined && r[k]!==null && r[k]!==''){
          merged[k] = r[k]; keeper[k] = r[k];
        }
      });
    });
    if(Object.keys(merged).length) ops.push({ref: colRef('partMaster').doc(keeper.id), type:'set', data: merged});
    others.forEach(r => { ops.push({ref: colRef('partMaster').doc(r.id), type:'delete'}); removedIds.add(r.id); });
  }
  await commitInChunks(ops);
  state.sheets.partMaster = state.sheets.partMaster.filter(r => !removedIds.has(r.id));
  renderTable('partMaster'); buildNav();
  showToast(`Merged and removed ${dupCount} duplicate row(s).`);
}

let activeFilterPopup = null;
function closeColumnFilterPopup(){
  if(activeFilterPopup){ activeFilterPopup.remove(); activeFilterPopup = null; }
  document.removeEventListener('mousedown', onDocClickForFilterPopup, true);
}
function onDocClickForFilterPopup(e){
  if(activeFilterPopup && !activeFilterPopup.contains(e.target) && !e.target.closest('[data-filter-col]')) closeColumnFilterPopup();
}
function wireColumnFilters(sheetKey){
  document.querySelectorAll('[data-filter-col]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const colKey = btn.getAttribute('data-filter-col');
      if(activeFilterPopup && activeFilterPopup.dataset.colKey === colKey){ closeColumnFilterPopup(); return; }
      openColumnFilterPopup(sheetKey, colKey, btn);
    });
  });
}
function openColumnFilterPopup(sheetKey, colKey, btnEl){
  closeColumnFilterPopup();
  const cfg = sheetCfg(sheetKey);
  const allRows = getRows(sheetKey);
  const values = Array.from(new Set(allRows.map(r => String(r[colKey] ?? '')))).sort((a,b)=>a.localeCompare(b));
  state.columnFilters[sheetKey] = state.columnFilters[sheetKey] || {};
  const selected = state.columnFilters[sheetKey][colKey]; // Set or undefined (undefined = all shown)

  const popup = document.createElement('div');
  popup.className = 'col-filter-popup';
  popup.dataset.colKey = colKey;
  const rect = btnEl.getBoundingClientRect();
  popup.style.top = Math.min(rect.bottom + 4, window.innerHeight - 340) + 'px';
  popup.style.left = Math.min(rect.left - 150, window.innerWidth - 236) + 'px';

  function isChecked(v){ return !selected || selected.has(v); }
  function itemsHtml(filterText){
    return values.filter(v => !filterText || v.toLowerCase().includes(filterText)).map(v => `
      <label><input type="checkbox" data-val="${escapeHtml(v)}" ${isChecked(v)?'checked':''}> ${escapeHtml(v)||'(blank)'}</label>
    `).join('') || `<div class="hint" style="padding:8px;">No values.</div>`;
  }

  popup.innerHTML = `
    <div class="cf-search"><input type="text" placeholder="Search values…" id="cfSearchInput"></div>
    <div class="cf-actions"><a id="cfSelectAll">Select all</a><a id="cfClearAll">Clear</a></div>
    <div class="cf-list" id="cfList">${itemsHtml('')}</div>
    <div class="cf-foot"><button class="btn btn-primary btn-sm" id="cfClose">Done</button></div>
  `;
  document.body.appendChild(popup);
  activeFilterPopup = popup;

  function applyFromCheckboxes(){
    const checked = Array.from(popup.querySelectorAll('#cfList input:checked')).map(el => el.getAttribute('data-val'));
    const searchVal = document.getElementById('cfSearchInput').value.trim().toLowerCase();
    const visibleValues = values.filter(v => !searchVal || v.toLowerCase().includes(searchVal));
    const uncheckedVisible = visibleValues.filter(v => !checked.includes(v));
    if(uncheckedVisible.length === 0 && searchVal === ''){
      // everything checked with no active search -> no filter
      delete state.columnFilters[sheetKey][colKey];
    } else {
      // build full selected set: checked-visible plus any values not currently visible that were already selected
      const prevSelected = selected;
      const newSet = new Set(checked);
      if(prevSelected){
        values.forEach(v => { if(!visibleValues.includes(v) && prevSelected.has(v)) newSet.add(v); });
      } else if(searchVal !== ''){
        values.forEach(v => { if(!visibleValues.includes(v)) newSet.add(v); });
      }
      state.columnFilters[sheetKey][colKey] = newSet;
    }
    renderTable(sheetKey);
  }

  popup.querySelector('#cfSearchInput').addEventListener('input', (e) => {
    document.getElementById('cfList').innerHTML = itemsHtml(e.target.value.trim().toLowerCase());
    wireCheckboxes();
  });
  function wireCheckboxes(){
    popup.querySelectorAll('#cfList input[type="checkbox"]').forEach(cb => { cb.onchange = applyFromCheckboxes; });
  }
  wireCheckboxes();
  document.getElementById('cfSelectAll').onclick = () => {
    popup.querySelectorAll('#cfList input[type="checkbox"]').forEach(cb => cb.checked = true);
    applyFromCheckboxes();
  };
  document.getElementById('cfClearAll').onclick = () => {
    popup.querySelectorAll('#cfList input[type="checkbox"]').forEach(cb => cb.checked = false);
    applyFromCheckboxes();
  };
  document.getElementById('cfClose').onclick = closeColumnFilterPopup;
  setTimeout(() => document.addEventListener('mousedown', onDocClickForFilterPopup, true), 0);
}

async function recalculateQtyFromBom(){
  const products = (state.mainProducts||[]).filter(p => p.name && p.name.trim());
  if(!products.length){ showToast('Add at least one main product with a name first.'); return; }
  if(!confirm('This overwrites "Required Qty" in Part Master for every part, based on BOM Master Qty/Each × your main product quantities. Continue?')) return;
  const bom = state.sheets.bomMaster || [];
  const singleProduct = products.length === 1 ? products[0] : null;
  const totals = {};
  bom.forEach(b => {
    if(!b.erpCode) return;
    let qty = 0;
    if(singleProduct){
      qty = (Number(b.qtyPerEach)||0) * (Number(singleProduct.quantity)||0);
    } else {
      const prod = products.find(p => p.name === b.product);
      if(prod) qty = (Number(b.qtyPerEach)||0) * (Number(prod.quantity)||0);
    }
    totals[b.erpCode] = Math.round(((totals[b.erpCode]||0) + qty) * 100) / 100;
  });
  let updated = 0;
  (state.sheets.partMaster||[]).forEach(p => {
    if(!p.erpCode) return;
    const newQty = totals[p.erpCode] || 0;
    if(Number(p.totalRequiredQuantity||0) !== newQty){
      updateRowField('partMaster', p.id, 'totalRequiredQuantity', newQty);
      updated++;
    }
  });
  renderTable('partMaster'); buildNav();
  showToast('Recalculated Required Qty for ' + updated + ' part(s).');
}

function checkSyncReport(){
  const bom = state.sheets.bomMaster || [];
  const pm = state.sheets.partMaster || [];
  const bomCodes = bom.map(b => (b.erpCode||'').trim()).filter(Boolean);
  const bomCodeCounts = {};
  bomCodes.forEach(c => { bomCodeCounts[c.toLowerCase()] = (bomCodeCounts[c.toLowerCase()]||0) + 1; });
  const bomDuplicates = Object.entries(bomCodeCounts).filter(([,n]) => n > 1);
  const bomUnique = new Set(Object.keys(bomCodeCounts));

  const pmCodes = pm.map(p => (p.erpCode||'').trim()).filter(Boolean);
  const pmCodeCounts = {};
  pmCodes.forEach(c => { pmCodeCounts[c.toLowerCase()] = (pmCodeCounts[c.toLowerCase()]||0) + 1; });
  const pmDuplicates = Object.entries(pmCodeCounts).filter(([,n]) => n > 1);

  const missingInPartMaster = Array.from(bomUnique).filter(c => !pmCodeCounts[c]);
  const orphansInPartMaster = Object.keys(pmCodeCounts).filter(c => !bomUnique.has(c));
  const noErpInBom = bom.length - bomCodes.length;
  const noErpInPm = pm.length - pmCodes.length;

  let html = `
    <div class="grid-cards" style="margin-bottom:16px;">
      <div class="card"><div class="label">BOM Master rows</div><div class="value">${bom.length}</div><div class="sub">${bomUnique.size} unique ERP codes</div></div>
      <div class="card"><div class="label">Part Master rows</div><div class="value">${pm.length}</div><div class="sub">${Object.keys(pmCodeCounts).length} unique ERP codes</div></div>
    </div>`;
  const issues = [];
  if(missingInPartMaster.length) issues.push(`<b>${missingInPartMaster.length} ERP code(s) in BOM Master have no Part Master row:</b> ${missingInPartMaster.map(escapeHtml).join(', ')}`);
  if(bomDuplicates.length) issues.push(`<b>${bomDuplicates.length} ERP code(s) appear more than once in BOM Master itself</b> (so only one Part Master row is created for each — this is expected, not an error): ${bomDuplicates.map(([c,n])=>escapeHtml(c)+' ×'+n).join(', ')}`);
  if(pmDuplicates.length) issues.push(`<b>${pmDuplicates.length} ERP code(s) have duplicate rows in Part Master</b> — use "Remove Duplicates" to fix: ${pmDuplicates.map(([c,n])=>escapeHtml(c)+' ×'+n).join(', ')}`);
  if(orphansInPartMaster.length) issues.push(`<b>${orphansInPartMaster.length} Part Master row(s) have an ERP code not found in BOM Master</b> (e.g. deleted from BOM Master, or typo'd): ${orphansInPartMaster.map(escapeHtml).join(', ')}`);
  if(noErpInBom) issues.push(`<b>${noErpInBom} BOM Master row(s) have no ERP Code entered</b> — they can't sync to Part Master until you fill that in.`);
  if(noErpInPm) issues.push(`<b>${noErpInPm} Part Master row(s) have no ERP Code.</b>`);

  html += issues.length
    ? `<div class="panel" style="grid-column:1/-1;"><h3 style="font-size:15px;">Found ${issues.length} issue(s)</h3><ul style="padding-left:18px; font-size:12.8px; line-height:1.9; margin:0;">${issues.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
    : `<div class="empty-state" style="grid-column:1/-1;">Everything is in sync — no issues found.</div>`;
  if(missingInPartMaster.length){
    html += `<button class="btn btn-primary btn-sm" id="fixMissingBtn" style="grid-column:1/-1; justify-self:start;">Add ${missingInPartMaster.length} missing part(s) to Part Master</button>`;
  }

  document.getElementById('modalTitle').textContent = 'BOM Master ↔ Part Master Sync Check';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalSave').style.display = 'none';
  document.getElementById('modalCancel').textContent = 'Close';
  document.getElementById('modalOverlay').classList.add('open');
  const fixBtn = document.getElementById('fixMissingBtn');
  if(fixBtn) fixBtn.onclick = async () => { closeModal(); await syncPartMasterFromBom(); };
}

        </div>
        <div class="ap-progress">
          <div class="ap-progress-track"><div class="ap-progress-fill" style="width:${total?(doneCount/total*100):0}%"></div></div>
          <span class="ap-progress-label">${doneCount}/${total}</span>

      <div class="ap-group-body" style="display:${collapsed?'none':'block'}">
        ${items.map(r => renderApStepRow(r)).join('')}

  html += `</div>`;
  html += `<div class="hint">${order.length} part(s) · ${visible.length} of ${totalCount} step(s) shown</div>`;

  content.innerHTML = html;
